<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Next Move Job Tracker</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: quiet single column; underline tabs; one idea per screen, lots of air. */
:root {
  --bg: #f7f8fa; --surface: #ffffff; --surface-2: #f2f4f7; --ink: #1a2330; --muted: #6a7686; --line: #e4e8ee;
  --accent: #2f4fc4; --accent-ink: #ffffff; --accent-soft: #eef1fb;
  --good: #1d7a43; --warn: #9a5b0a; --bad: #b42318;
  --s-saved: #6a7686; --s-applied: #2f4fc4; --s-interviewing: #9a5b0a; --s-offer: #1d7a43; --s-rejected: #b42318; --s-withdrawn: #8a9099;
  --shadow: 0 1px 2px rgba(26,35,48,.05), 0 8px 24px rgba(26,35,48,.07);
  --f-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body: "IBM Plex Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #10151b; --surface: #161c24; --surface-2: #1c232d; --ink: #e4e9ef; --muted: #93a0ae; --line: #252e39;
  --accent: #8ea4ff; --accent-ink: #0b1020; --accent-soft: #1b2440;
  --good: #5cc98b; --warn: #eaa548; --bad: #ff8574;
  --s-saved: #93a0ae; --s-applied: #8ea4ff; --s-interviewing: #eaa548; --s-offer: #5cc98b; --s-rejected: #ff8574; --s-withdrawn: #8d939b;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
  color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #10151b; --surface: #161c24; --surface-2: #1c232d; --ink: #e4e9ef; --muted: #93a0ae; --line: #252e39;
  --accent: #8ea4ff; --accent-ink: #0b1020; --accent-soft: #1b2440;
  --good: #5cc98b; --warn: #eaa548; --bad: #ff8574;
  --s-saved: #93a0ae; --s-applied: #8ea4ff; --s-interviewing: #eaa548; --s-offer: #5cc98b; --s-rejected: #ff8574; --s-withdrawn: #8d939b;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.55; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.wrap { max-width: 1040px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; margin: 0; letter-spacing: -0.01em; font-weight: 600; }
h2 { font-size: 1.75rem; }
h3 { font-size: 1rem; }
.mono, .date { font-family: var(--f-mono); font-variant-numeric: tabular-nums; font-size: .85em; }
.muted { color: var(--muted); }
a { color: var(--accent); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 7px 14px; font-weight: 500; }
button:hover { border-color: var(--muted); }
button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
button.primary:hover { filter: brightness(1.08); }
button.ghost { background: transparent; border-color: transparent; color: var(--muted); padding: 6px 10px; }
button.ghost:hover { color: var(--ink); background: var(--surface-2); }
button.danger { color: var(--bad); }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, .card:focus-visible, tr:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
input, select, textarea { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; width: 100%; min-width: 0; }
textarea { resize: vertical; }
label { display: grid; gap: 4px; font-size: .85rem; font-weight: 500; color: var(--muted); }
label.check { display: flex; align-items: center; gap: 8px; color: var(--ink); }
label.check input { width: auto; }

/* Header */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); border-bottom: 1px solid var(--line); }
.top-in { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 28px; padding-block: 14px 0; }
.brand { font-family: var(--f-display); font-weight: 700; font-size: 1.2rem; padding-bottom: 12px; }
.brand span { color: var(--accent); }
.tabs { display: flex; gap: 22px; overflow-x: auto; max-width: 100%; margin-right: auto; }
.tabs button { border: 0; border-radius: 0; background: transparent; padding: 4px 0 12px; white-space: nowrap; color: var(--muted); border-bottom: 2px solid transparent; }
.tabs button:hover { color: var(--ink); }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.tabs .count { font-family: var(--f-mono); font-size: .72rem; margin-left: 5px; color: var(--bad); }
.head-actions { display: flex; gap: 6px; padding-bottom: 10px; }

main { padding-block: 36px 56px; display: grid; gap: 28px; }
main > * { min-width: 0; }
#view { display: grid; gap: 28px; }
.view-head { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 12px; }
.view-head p { margin: 6px 0 0; color: var(--muted); max-width: 60ch; }

.note { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; color: var(--muted); font-size: .88rem; }
.note.warn { color: var(--warn); }
.welcome { display: grid; gap: 6px; max-width: 70ch; }
.welcome p { margin: 0; }
.welcome .row { margin-top: 6px; }
.fit { font-size: .76rem; font-weight: 600; color: var(--good); white-space: nowrap; }
.fit.low { color: var(--warn); }
.goal { display: grid; gap: 8px; max-width: 760px; }
.goal-top { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; font-size: .92rem; }
.goal-bar { height: 6px; background: var(--surface-2); border-radius: 3px; overflow: hidden; }
.goal-bar div { height: 100%; background: var(--good); border-radius: 3px; }
.profile-intro { margin: 0; color: var(--muted); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.start { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 22px; display: grid; gap: 14px; }
.steps { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px; }
.step { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 12px; align-items: start; }
.step p { margin: 4px 0 10px; color: var(--muted); font-size: .9rem; }
.step-n { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-weight: 600; background: var(--accent-soft); color: var(--accent); font-size: .9rem; }
.step.done .step-n { background: color-mix(in srgb, var(--good) 15%, transparent); color: var(--good); }
.step.done strong { color: var(--muted); text-decoration: line-through; }
.sec { display: grid; gap: 12px; }
.sec > * { min-width: 0; }
.sec-h { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; border-bottom: 1px solid var(--line); padding-bottom: 8px; }
.sec-h h3 { font-size: 1.15rem; }
.sec-h .muted { font-size: .85rem; }
.tasks { display: grid; }
.toolbar { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
.toolbar input { flex: 1 1 260px; }
label.inline { display: flex; align-items: center; gap: 8px; }
label.inline select { width: auto; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border-radius: 99px; padding: 4px 12px; font-size: .85rem; color: var(--muted); background: transparent; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.status-select { width: auto; padding: 4px 8px; font-size: .85rem; border-color: color-mix(in srgb, var(--c) 45%, var(--line)); color: var(--c); font-weight: 500; }
.add-next { color: var(--accent); font-size: .88rem; }
.job strong { font-weight: 600; }
.upload { display: grid; gap: 8px; }
.upload-box { display: grid; gap: 4px; border: 1.5px dashed var(--line); border-radius: 12px; padding: 18px; color: var(--ink); cursor: pointer; background: var(--surface-2); }
.upload-box:hover { border-color: var(--accent); }
.upload-box input { border: 0; padding: 6px 0 0; background: transparent; }
.match { display: grid; gap: 4px; background: var(--surface-2); border-radius: 10px; padding: 12px 14px; font-size: .9rem; }
.match p { margin: 0; }
p.match { display: block; }
@media (max-width: 760px) { .steps { grid-template-columns: minmax(0, 1fr); } }
.table-scroll { position: relative; }
@media (max-width: 560px) { #btnProfile { padding: 6px 4px; font-size: .85rem; } .table-scroll table { min-width: 0; } .table-scroll th:nth-child(3), .table-scroll td:nth-child(3), .table-scroll th:nth-child(5), .table-scroll td:nth-child(5) { display: none; } th, td { padding: 12px 6px; } }
.insights { display: grid; gap: 4px; }
.insight { padding: 14px 0; border-top: 1px solid var(--line); display: grid; gap: 2px; max-width: 72ch; }
.insight p { margin: 0; }
.note button { padding: 0; border: 0; background: none; color: var(--accent); font-weight: 500; }
.note button:hover { text-decoration: underline; }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 22px; min-width: 0; }

/* Status: small dot + word, no fills */
.pill { --c: var(--s-saved); display: inline-flex; align-items: center; gap: 6px; font-size: .82rem; color: var(--muted); white-space: nowrap; }
.pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--c); }
[data-s="saved"] { --c: var(--s-saved); } [data-s="applied"] { --c: var(--s-applied); } [data-s="interviewing"] { --c: var(--s-interviewing); }
[data-s="offer"] { --c: var(--s-offer); } [data-s="rejected"] { --c: var(--s-rejected); } [data-s="withdrawn"] { --c: var(--s-withdrawn); }
.due { font-family: var(--f-mono); font-size: .8rem; color: var(--muted); white-space: nowrap; }
.due.over { color: var(--bad); }

/* Today */
.today { display: grid; gap: 32px; max-width: 760px; }
.group { display: grid; gap: 2px; }
.group-h { font-size: .78rem; text-transform: uppercase; letter-spacing: .08em; font-weight: 600; color: var(--muted); margin-bottom: 8px; }
.group-h.over { color: var(--bad); }
.task { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 14px 4px; border-bottom: 1px solid var(--line); }
.task:last-child { border-bottom: 0; }
.task .t-main { min-width: 0; }
.task .t-what { font-weight: 500; }
.task .t-who { color: var(--muted); font-size: .88rem; overflow-wrap: anywhere; }
.donebox { width: 20px; height: 20px; border-radius: 50%; border: 1.5px solid var(--muted); padding: 0; background: transparent; }
.donebox:hover { border-color: var(--good); background: color-mix(in srgb, var(--good) 18%, transparent); }
.donebox-spacer { width: 20px; }
.empty { color: var(--muted); padding: 28px 0; }
.empty button { color: var(--accent); font-weight: 500; }
.mini-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.mini-list li { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; }
.mini-list li span:first-child { min-width: 0; overflow-wrap: anywhere; }
.linkish { background: none; border: 0; padding: 0; color: inherit; text-align: left; font-weight: inherit; }
.linkish:hover { color: var(--accent); text-decoration: underline; }
.more { justify-self: start; padding-left: 0; padding-right: 0; }

/* Board */
.board-scroll { overflow-x: auto; padding-bottom: 8px; }
.board { display: grid; grid-template-columns: repeat(6, minmax(160px, 1fr)); gap: 14px; min-width: 1040px; }
.col { border-radius: 12px; padding: 6px; display: flex; flex-direction: column; gap: 8px; min-height: 320px; }
.col.over { background: var(--accent-soft); }
.col-h { display: flex; justify-content: space-between; align-items: center; padding: 4px 6px 8px; }
.col-h .n { font-family: var(--f-mono); color: var(--muted); font-size: .8rem; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px; display: grid; gap: 4px; cursor: grab; }
.card:hover { box-shadow: var(--shadow); }
.card.dragging { opacity: .45; }
.card .co { font-weight: 600; overflow-wrap: anywhere; }
.card .ti { color: var(--muted); font-size: .86rem; overflow-wrap: anywhere; }
.card .nx { font-size: .8rem; color: var(--muted); margin-top: 4px; overflow-wrap: anywhere; }
.card .nx .due { display: block; margin-top: 2px; }
.card select { font-size: .8rem; padding: 3px 6px; margin-top: 6px; display: none; }
@media (hover: none) { .card select { display: block; } }

/* List */
.filters { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr) minmax(0, 1fr); gap: 12px; }
.table-scroll { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; min-width: 640px; }
th, td { text-align: left; padding: 14px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: .75rem; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 600; }
tbody tr { cursor: pointer; }
tbody tr:hover { background: var(--surface); }
td .sub { color: var(--muted); font-size: .86rem; }

/* Dashboard */
.kpis { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.kpi { display: grid; gap: 2px; }
.kpi .v { font-family: var(--f-display); font-size: 2.4rem; line-height: 1.1; font-variant-numeric: tabular-nums; font-weight: 600; }
.kpi .l { font-size: .85rem; color: var(--muted); }
.dash-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; }
.dash-grid h3 { margin-bottom: 16px; }
.bars { display: grid; gap: 10px; }
.bar-row { display: grid; grid-template-columns: 100px minmax(0, 1fr) 28px; gap: 12px; align-items: center; font-size: .88rem; }
.bar-track { height: 8px; background: var(--surface-2); border-radius: 4px; overflow: hidden; }
.bar-fill { height: 100%; background: var(--c); border-radius: 4px; }
.bar-row .num { font-family: var(--f-mono); text-align: right; color: var(--muted); }
.chart svg { width: 100%; height: auto; display: block; }
.chart text { fill: var(--muted); font-family: var(--f-mono); font-size: 11px; }

/* Modal */
.overlay { position: fixed; inset: 0; z-index: 50; background: color-mix(in srgb, var(--ink) 40%, transparent); display: flex; align-items: flex-start; justify-content: center; overflow-y: auto; padding: max(24px, env(safe-area-inset-top, 0px)) max(12px, env(safe-area-inset-right, 0px)) 24px max(12px, env(safe-area-inset-left, 0px)); }
.modal { background: var(--surface); border-radius: 14px; width: 100%; max-width: 680px; box-shadow: var(--shadow); border: 1px solid var(--line); }
.modal-h { display: flex; justify-content: space-between; align-items: center; padding: 20px 24px 8px; gap: 12px; }
.modal-h h2 { font-size: 1.35rem; }
.modal-b { padding: 12px 24px 20px; display: grid; gap: 24px; }
.modal-f { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; padding: 16px 24px; border-top: 1px solid var(--line); }
.modal-f .left { margin-right: auto; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
fieldset { border: 0; padding: 0; margin: 0; display: grid; gap: 12px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
fieldset .full { grid-column: 1 / -1; }
legend { font-weight: 600; font-size: .95rem; padding: 0; margin-bottom: 10px; }
details.more-fields > summary { cursor: pointer; color: var(--accent); font-weight: 500; }
details.more-fields[open] > summary { margin-bottom: 14px; }
.jd { display: grid; gap: 8px; }
.jd summary { cursor: pointer; color: var(--accent); font-weight: 500; }
.jd[open] summary { margin-bottom: 4px; }
.tag { font-size: .75rem; color: var(--muted); font-weight: 400; margin-left: 4px; }
.data-sec { display: grid; gap: 8px; }
.data-sec p { margin: 0; color: var(--muted); }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.err { color: var(--bad); font-size: .88rem; }

.toast { position: fixed; z-index: 60; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 10px 14px; border-radius: 10px; display: flex; gap: 12px; align-items: center; box-shadow: var(--shadow); max-width: calc(100% - 32px); }
.toast button { background: transparent; color: var(--bg); border-color: color-mix(in srgb, var(--bg) 40%, transparent); padding: 4px 10px; }

footer { padding-block: 0 40px; color: var(--muted); font-size: .85rem; }
footer p { margin: 0; max-width: 80ch; }
footer button { padding: 0; border: 0; background: none; color: var(--accent); font-weight: 500; }

@media (max-width: 760px) {
  .dash-grid { grid-template-columns: minmax(0, 1fr); }
  .kpis { gap: 10px; }
  .kpi .v { font-size: 1.9rem; }
  .filters { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  .filters .search { grid-column: 1 / -1; }
  .top-in { gap: 4px 16px; }
  .tabs { order: 3; width: 100%; gap: 18px; }
  .head-actions { margin-left: auto; padding-bottom: 6px; }
  .brand { padding-bottom: 6px; }
}
@media (max-width: 560px) {
  fieldset { grid-template-columns: minmax(0, 1fr); }
  .kpis { grid-template-columns: minmax(0, 1fr); }
  .task { grid-template-columns: auto minmax(0, 1fr); }
  .task .due { grid-column: 2; }
  #btnData { display: none; }
  main { padding-block: 24px 40px; }
}
@media (prefers-reduced-motion: no-preference) {
  .card, button { transition: box-shadow .15s, border-color .15s, background-color .15s, color .15s; }
}
</style>
</head>
<body>

<header class="top">
  <div class="wrap top-in">
    <div class="brand">Next<span>Move</span></div>
    <nav class="tabs" role="tablist" aria-label="Views">
      <button role="tab" data-view="home" id="tab-home">Home</button>
      <button role="tab" data-view="board" id="tab-board">Board</button>
      <button role="tab" data-view="dash" id="tab-dash">Insights</button>
    </nav>
    <div class="head-actions">
      <button id="btnProfile" class="ghost" type="button">About me &amp; resume</button>
      <button id="btnAdd" class="primary" type="button">+ Add a job</button>
    </div>
  </div>
</header>

<main class="wrap">
  <div id="banners" class="group" hidden></div>
  <section id="view"></section>
</main>

<footer class="wrap">
  <p>Your data is saved in this browser on this device only. Nothing is sent to a server. <button id="btnFooterData" type="button">Back up or move your data</button></p>
</footer>

<div id="modalRoot"></div>
<div id="toastRoot"></div>

<script>
(function () {
  "use strict";
  var KEY = "nextmove.tracker.v1";
  var VIEW_KEY = "nextmove.view";
  var STATUSES = [
    { id: "saved", label: "Saved" },
    { id: "applied", label: "Applied" },
    { id: "interviewing", label: "Interviewing" },
    { id: "offer", label: "Offer" },
    { id: "rejected", label: "Rejected" },
    { id: "withdrawn", label: "Withdrawn" }
  ];
  var CLOSED = { rejected: 1, withdrawn: 1 };
  var INTEREST = { high: 3, medium: 2, low: 1 };
  var FOLLOW_UP_DAYS = 14; // Career Services guide: reach out two weeks after applying / posting closes

  // ---------- Dates ----------
  function pad(n) { return (n < 10 ? "0" : "") + n; }
  function iso(d) { return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
  function today() { return iso(new Date()); }
  function parseISO(s) { var p = s.split("-"); return new Date(+p[0], +p[1] - 1, +p[2]); }
  function addDays(s, n) { var d = parseISO(s); d.setDate(d.getDate() + n); return iso(d); }
  function diffDays(a, b) { return Math.round((parseISO(a) - parseISO(b)) / 86400000); } // a - b
  var MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  function fmt(s) { if (!s) return ""; var d = parseISO(s); return MONTHS[d.getMonth()] + " " + d.getDate(); }
  function rel(s) {
    var n = diffDays(s, today());
    if (n === 0) return "today";
    if (n === 1) return "tomorrow";
    if (n === -1) return "yesterday";
    if (n < 0) return -n + "d overdue";
    if (n < 7) return "in " + n + "d";
    return fmt(s);
  }
  function dueChip(s, label) {
    if (!s) return "";
    var n = diffDays(s, today());
    var cls = n < 0 ? "due over" : n <= 3 ? "due soon" : "due";
    return '<span class="' + cls + '" title="' + esc(fmt(s)) + '">' + (label ? esc(label) + " " : "") + esc(rel(s)) + "</span>";

  // ---------- Utils ----------

  // ---------- Job description extraction (rule-based) ----------
  function extractJD(text) {
    var r = {}; if (!text || !text.trim()) return r;
    var lines = text.split(/\r?\n/).map(function (l) { return l.trim(); }).filter(Boolean);
    var m;
    m = text.match(/https?:\/\/[^\s)>"']+/i); if (m) r.link = m[0];
    m = text.match(/(?:job\s*title|position|role)\s*[:\-–]\s*(.+)/i); if (m) r.title = m[1].trim();
    m = text.match(/(?:company(?:\s*name)?|employer|organization)\s*[:\-–]\s*(.+)/i); if (m) r.company = m[1].trim();
    if (!r.title || !r.company) {
      for (var i = 0; i < Math.min(lines.length, 6); i++) {
        var at = lines[i].match(/^(.{3,80}?)\s+(?:at|@|\||-|–|—)\s+(.{2,60})$/);
        if (at && !/https?:/.test(lines[i])) { r.title = r.title || at[1].trim(); r.company = r.company || at[2].trim(); break; }
      }
    }
    if (!r.company) { m = text.match(/(?:join|about)\s+(?:us\s+at\s+)?([A-Z][\w&.\-]*(?:\s+[A-Z][\w&.\-]*){0,3})/); if (m && !/^(The|Our|Us|This)$/.test(m[1])) r.company = m[1].trim(); }
    if (!r.title) {
      var kw = /(analyst|scientist|intern|engineer|manager|associate|consultant|specialist|coordinator|developer|strategist)/i;
      for (var j = 0; j < Math.min(lines.length, 8); j++) if (kw.test(lines[j]) && lines[j].length < 90) { r.title = lines[j].replace(/^(job\s*title|position|role)\s*[:\-–]\s*/i, ""); break; }
    }
    if (/\bhybrid\b/i.test(text)) r.arrangement = "Hybrid";
    else if (/\b(fully\s+remote|100%\s+remote|remote)\b/i.test(text)) r.arrangement = "Remote";
    else if (/\b(on-?site|in[-\s]office|in[-\s]person)\b/i.test(text)) r.arrangement = "On-site";
    m = text.match(/(?:location|based in|located in)\s*[:\-–]?\s*([A-Z][a-zA-Z.\s]+,\s*[A-Z]{2})\b/); if (m) r.location = m[1].trim();
    if (!r.location) { m = text.match(/\b([A-Z][a-zA-Z.]+(?:\s[A-Z][a-zA-Z.]+)?,\s*(?:A[KLRZ]|C[AOT]|D[CE]|FL|GA|HI|I[ADLN]|K[SY]|LA|M[ADEINOST]|N[CDEHJMVY]|O[HKR]|PA|RI|S[CD]|T[NX]|UT|V[AT]|W[AIVY]))\b/); if (m) r.location = m[1]; }
    var dl = text.match(/(?:deadline|apply by|applications? (?:close|due)|closing date|closes)[^\n\d]{0,20}?([A-Za-z]{3,9}\.?\s+\d{1,2}(?:st|nd|rd|th)?,?\s*\d{0,4}|\d{1,2}\/\d{1,2}\/\d{2,4}|\d{4}-\d{2}-\d{2})/i);
    if (dl) { var d = parseLooseDate(dl[1]); if (d) r.deadline = d; }
    return r;
  }
  function parseLooseDate(s) {
    s = s.replace(/(\d)(st|nd|rd|th)\b/, "$1").replace(".", "").trim(); var m;
    if ((m = s.match(/^(\d{4})-(\d{2})-(\d{2})$/))) return s;
    if ((m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/))) { var y = +m[3]; if (y < 100) y += 2000; return y + "-" + pad(+m[1]) + "-" + pad(+m[2]); }
    if ((m = s.match(/^([A-Za-z]{3})[a-z]*\s+(\d{1,2}),?\s*(\d{4})?$/))) {
      var mi = MONTHS.map(function (x) { return x.toLowerCase(); }).indexOf(m[1].toLowerCase()); if (mi < 0) return "";
      var yy = m[3] ? +m[3] : new Date().getFullYear(); var out = yy + "-" + pad(mi + 1) + "-" + pad(+m[2]);
      if (!m[3] && out < today()) out = (yy + 1) + out.slice(4);
      return out;
    }
    return "";
  }

  // ---------- Import / Export ----------
  var CSV_COLS = ["company", "title", "status", "link", "location", "arrangement", "deadline", "interest", "appliedDate", "nextAction", "nextDue", "resume", "contact", "interviewDate", "thankYouSent", "notes"];
  // Headers from the Career Services "Job and Internship Search Guide" spreadsheet, so a saved-as-CSV copy imports cleanly.
  var ALIASES = [
    [/^company/i, "company"], [/job\s*title|position title|^title|^role/i, "title"], [/^location/i, "location"], [/link|url|posting/i, "link"],
    [/closes|deadline/i, "deadline"], [/network/i, "contact"], [/resume|cover/i, "resume"], [/^date of interview|^interview/i, "interviewDate"],
    [/thank/i, "thankYouSent"], [/notes/i, "notes"], [/status|stage/i, "status"], [/arrangement/i, "arrangement"], [/interest|priority/i, "interest"],
    [/applied/i, "appliedDate"], [/next ?action/i, "nextAction"], [/next ?due|due/i, "nextDue"]
  ];
  function toCSV() {
    var q = function (v) { v = v == null ? "" : String(v); return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
    return [CSV_COLS.join(",")].concat(state.opps.map(function (o) { return CSV_COLS.map(function (k) { return q(o[k]); }).join(","); })).join("\n");
  }
  function parseCSV(text) {
    var rows = [], row = [], cur = "", inQ = false;
    for (var i = 0; i < text.length; i++) {
      var c = text[i];
      if (inQ) { if (c === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else inQ = false; } else cur += c; }
      else if (c === '"') inQ = true;
      else if (c === ",") { row.push(cur); cur = ""; }
      else if (c === "\n" || c === "\r") { if (c === "\r" && text[i + 1] === "\n") i++; row.push(cur); rows.push(row); row = []; cur = ""; }
      else cur += c;
    }
    if (cur || row.length) { row.push(cur); rows.push(row); }
    return rows.filter(function (r) { return r.some(function (x) { return x.trim(); }); });
  }
  function anyDate(v) {
    v = (v || "").trim(); if (!v) return "";
    if (/^\d{4}-\d{2}-\d{2}/.test(v)) return v.slice(0, 10);
    return parseLooseDate(v) || "";
  }
  function importCSV(text) {
    var rows = parseCSV(text); if (!rows.length) throw new Error("The file is empty.");
    var hi = rows.findIndex(function (r) { return r.some(function (c) { return /company/i.test(c); }); });
    if (hi < 0) throw new Error("Couldn't find a header row with a “Company” column.");
    var map = rows[hi].map(function (hname, idx) {
      hname = hname.trim(); if (CSV_COLS.indexOf(hname) >= 0) return hname;
      for (var i = 0; i < ALIASES.length; i++) if (ALIASES[i][0].test(hname)) {
        // second "Thank You Note Sent" / second interview columns: keep the first match only
        return ALIASES[i][1];
      }
      return null;
    });
    var seen = {}; map = map.map(function (k) { if (!k) return null; if (seen[k]) return k === "notes" ? "notes" : null; seen[k] = 1; return k; });
    var out = [];
    rows.slice(hi + 1).forEach(function (r) {
      var o = {}; r.forEach(function (v, i) { var k = map[i]; if (!k) return; o[k] = k === "notes" && o.notes ? o.notes + " " + v : v.trim(); });
      if (!o.company) return;
      ["deadline", "appliedDate", "nextDue", "interviewDate"].forEach(function (k) { if (o[k]) o[k] = anyDate(o[k]); });
      if (o.status) o.status = o.status.toLowerCase();
      if (o.interest) o.interest = o.interest.toLowerCase();
      if (o.location && !o.arrangement) { if (/hybrid/i.test(o.location)) o.arrangement = "Hybrid"; else if (/remote/i.test(o.location)) o.arrangement = "Remote"; else if (/in[-\s]?person|on-?site/i.test(o.location)) o.arrangement = "On-site"; }
      if (o.resume && /^(yes|y|true|x|✓)$/i.test(o.resume)) { o.resume = "Submitted"; if (!o.status) o.status = "applied"; }
      if (!o.title) o.title = "(no title)";
      var n = normalize(o); n.id = uid(); out.push(n);
    });
    return out;
  }
  function download(name, text, type) {

    };
    $("#imFile").addEventListener("change", function (e) { var file = e.target.files[0]; if (!file) return; var r = new FileReader(); r.onload = function () { doImport(String(r.result), file.name); }; r.readAsText(file); });

    var vg = t.closest("[data-view-go]"); if (vg) { view = vg.dataset.viewGo; setPref(VIEW_KEY, view); render(); window.scrollTo(0, 0); return; }
    if (t.closest("#btnProfile") || t.closest("[data-act='profile']")) { openProfile(); return; }
    if (t.closest("#btnFooterData")) { openData(); return; }
    if (t.closest("[data-act='toggle-tasks']")) { showAllTasks = !showAllTasks; render(); return; }
    if (t.closest("[data-act='load-samples']")) { state.opps = sampleData().concat(state.opps); save(); render(); toast("Sample jobs added. Remove them any time."); return; }
    if (t.closest("[data-act='clear-examples']")) { var removed = state.opps.filter(function (o) { return o.example; }); state.opps = state.opps.filter(function (o) { return !o.example; }); save(); render(); toast("Sample jobs removed.", "Undo", function () { state.opps = removed.concat(state.opps); save(); render(); }); return; }
    var chip = t.closest("[data-filter]"); if (chip) { listState.status = chip.dataset.filter; $all("[data-filter]").forEach(function (c) { c.setAttribute("aria-pressed", c === chip ? "true" : "false"); }); renderJobRows(); return; }
    var dn = t.closest("[data-done]"); if (dn) { completeTask(dn.dataset.done, dn.dataset.id); return; }
    var op = t.closest("[data-open]"); if (op) { openEditor(op.dataset.open, op.dataset.focus); return; }
    if (t.closest("select") || t.closest("a")) return;
    var card = t.closest("[data-card]"); if (card) { openEditor(card.dataset.card); return; }
  });
  document.addEventListener("keydown", function (e) {
    if (e.key !== "Enter") return;
    var c = e.target.closest && e.target.closest("[data-card]");
    if (c && e.target === c) openEditor(c.dataset.card);
  });
  document.addEventListener("change", function (e) {
    var t = e.target;
    if (t.dataset.move) { moveTo(t.dataset.move, t.value); return; }
    if (t.id === "f-sort") { listState.sort = t.value; renderJobRows(); }
  });
  document.addEventListener("input", function (e) { if (e.target.id === "f-q") { listState.q = e.target.value; renderJobRows(); } });

  load();
  if (["home", "board", "dash"].indexOf(view) < 0) view = "home";
  render();
})();
</script>
</body>
</html>
