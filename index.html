<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Next Move Job Tracker</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap">
<style>
/* Layout: header with three tabs (Dashboard, Jobs, My resume). Dashboard = numbers, to-dos, pipeline, best matches.
   Each job has its own page: match score breakdown, resume tailoring (AI or rule-based), details. */
:root {
  --bg: #fbfaf6; --card: #ffffff; --soft-bg: #f3f1ea; --ink: #1f2a24; --muted: #66736b; --line: #e7e4dc;
  --accent: #3f7d5c; --accent-ink: #2d5d44; --on-accent: #ffffff; --tint: #e3efe7;
  --warn: #9a6a12; --warn-tint: #f6ecd6; --late: #b5462f;
  --shadow: 0 1px 2px rgba(31,42,36,.05), 0 10px 30px rgba(31,42,36,.08);
  --font: "DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #141815; --card: #1b201c; --soft-bg: #222823; --ink: #e8ece9; --muted: #9eaaa2; --line: #2c332e;
  --accent: #6fbf94; --accent-ink: #8fd3ad; --on-accent: #0f1a14; --tint: #20372a;
  --warn: #e3b55a; --warn-tint: #3a3020; --late: #f08a70;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 30px rgba(0,0,0,.35);
  color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #141815; --card: #1b201c; --soft-bg: #222823; --ink: #e8ece9; --muted: #9eaaa2; --line: #2c332e;
  --accent: #6fbf94; --accent-ink: #8fd3ad; --on-accent: #0f1a14; --tint: #20372a;
  --warn: #e3b55a; --warn-tint: #3a3020; --late: #f08a70;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 30px rgba(0,0,0,.35);
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 16px; line-height: 1.55; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.wrap { max-width: 1040px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1, h2, h3 { margin: 0; line-height: 1.2; text-wrap: balance; }
h2 { font-size: 2rem; font-weight: 700; letter-spacing: -0.02em; }
h3 { font-size: 1.1rem; font-weight: 700; }
p { margin: 0; }
ul { margin: 0; padding-left: 1.2em; display: grid; gap: 6px; }
.muted { color: var(--muted); }
a { color: var(--accent-ink); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 8px 16px; font-weight: 500; }
button:hover { border-color: var(--muted); }
button:disabled { opacity: .6; cursor: progress; }
button.primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); font-weight: 700; }
button.primary:hover { filter: brightness(1.07); }
button.link { border: 0; background: none; padding: 0; color: var(--accent-ink); font-weight: 500; border-radius: 0; text-align: left; }
button.link:hover { text-decoration: underline; }
button.danger { color: var(--late); }
button.small { padding: 4px 12px; font-size: .85rem; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.drop:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
input, select, textarea { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; width: 100%; min-width: 0; }
textarea { resize: vertical; }
label { display: grid; gap: 6px; font-size: .9rem; font-weight: 500; }
label .hint, .or .hint { font-weight: 400; color: var(--muted); font-size: .85rem; }

/* Header */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); border-bottom: 1px solid var(--line); }
.top-in { display: flex; align-items: center; gap: 24px; padding-block: 12px; }
.logo { font-weight: 700; font-size: 1.2rem; letter-spacing: -0.01em; }
.logo span { color: var(--accent); }
.tabs { display: flex; gap: 4px; }
.tabs a { text-decoration: none; color: var(--muted); font-weight: 500; padding: 7px 14px; border-radius: 999px; white-space: nowrap; }
.tabs a:hover { color: var(--ink); background: var(--soft-bg); }
.tabs a[aria-current="page"] { color: var(--accent-ink); background: var(--tint); font-weight: 700; }
#btnAdd { margin-left: auto; white-space: nowrap; }
#btnAdd[hidden] + .acct { margin-left: auto; }

main { padding-block: 28px 48px; display: grid; gap: 24px; }
main > * { min-width: 0; }
.hello { display: grid; gap: 6px; }
.hello p { color: var(--muted); font-size: 1.05rem; }

.card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 22px; display: grid; gap: 14px; min-width: 0; align-content: start; }
.card-h { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.home { display: grid; gap: 20px; max-width: 760px; width: 100%; margin-inline: auto; }
.hero { display: grid; gap: 26px; padding: 34px 36px; border-radius: 24px; color: #fff;
  background: radial-gradient(circle at 100% 0%, rgba(255,255,255,.12), transparent 45%), linear-gradient(135deg, #1d4b36 0%, #2f6e4e 60%, #3f8a62 100%); box-shadow: var(--shadow); }
.hero-main { display: grid; gap: 10px; justify-items: start; min-width: 0; }
.hero .eyebrow { margin: 0; text-transform: uppercase; letter-spacing: .08em; font-size: .8rem; font-weight: 700; color: #cfe8da; }
.hero h2 { font-size: 2.3rem; line-height: 1.1; letter-spacing: -0.02em; color: #fff; overflow-wrap: anywhere; }
.hero-sub { margin: 0; color: #e2f0e8; font-size: 1.05rem; }
.hero .when, .hero .when.soon, .hero .when.late { color: #fff; background: rgba(255,255,255,.16); padding: 1px 8px; border-radius: 999px; font-weight: 700; }
.hero-btn { margin-top: 6px; background: #fff; color: #1d4b36; border: 0; border-radius: 999px; padding: 12px 22px; font-weight: 700; font-size: 1rem; }
.hero-btn:hover { background: #e9f5ee; }
.hero-stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.hero-stats a { display: grid; align-content: start; text-decoration: none; color: #fff; background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.14); border-radius: 16px; padding: 12px 18px; }
.hero-stats a:hover { background: rgba(255,255,255,.18); }
.hero-stats b { font-size: 2rem; line-height: 1; letter-spacing: -0.02em; min-width: 2.2ch; }
.hero-stats span { font-weight: 600; }
.hero-stats small { color: #cfe8da; font-size: .85rem; }
.upnext .see-all { display: inline-block; margin-top: 10px; font-weight: 700; color: var(--accent-ink); }
.mini { display: grid; gap: 6px; }
.mini-r { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; align-items: center; text-align: left; background: none; border: 0; border-radius: 12px; padding: 8px; font-weight: 400; }
.mini-r:hover { background: var(--soft-bg); }
.mini-r span { display: grid; min-width: 0; }
.mini-r small { color: var(--muted); font-size: .88rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
button.link.more { justify-self: start; margin-top: 8px; font-weight: 700; }
.bcol button.link.more { justify-self: center; margin: 4px 0; }
.jobs > button.link.more { margin: 12px auto 0; display: block; }
.grid2 { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); gap: 24px; align-items: start; }
.grid2 > * { min-width: 0; }
.narrow { max-width: 760px; }

/* Stat tiles */
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; }
.stat { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 18px 20px; display: grid; gap: 2px; }
.stat b { font-size: 2rem; line-height: 1.1; letter-spacing: -0.02em; }
.stat span { color: var(--muted); font-size: .92rem; }
.stat small { color: var(--muted); font-size: .8rem; }
.stat.hero { background: var(--tint); border-color: transparent; }
.stat.hero b { color: var(--accent-ink); }

/* Welcome */
.start { display: grid; gap: 20px; justify-items: center; padding-block: 24px; }
.start-card { width: 100%; max-width: 440px; display: grid; gap: 14px; padding: 28px; }
.start-card h2 { font-size: 1.7rem; text-align: center; }
.start-card > p.muted { text-align: center; margin-top: -6px; }
.start #profileBox { width: 100%; max-width: 760px; }
.start #profileBox:empty { display: none; }
button.wide { width: 100%; justify-content: center; text-align: center; }
.start-card .swap { text-align: center; margin: 0; }
.start-card .or { display: grid; justify-items: center; gap: 2px; margin: 0; padding-top: 12px; border-top: 1px solid var(--line); }
.start-card .or button.link { text-align: center; }
.drop { position: relative; display: grid; gap: 8px; justify-items: center; text-align: center; border: 2px dashed var(--line); border-radius: 16px; padding: 24px 16px; background: var(--card); cursor: pointer; font-weight: 400; font-size: 1rem; }
.drop:hover, .drop.over { border-color: var(--accent); background: var(--tint); }
.drop strong { font-size: 1.1rem; }
.drop input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
.drop .btnlike { background: var(--accent); color: var(--on-accent); border-radius: 999px; padding: 9px 18px; font-weight: 700; }
.status:empty { display: none; }
.status.err { color: var(--late); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { background: var(--tint); color: var(--accent-ink); border-radius: 999px; padding: 3px 10px; font-size: .85rem; font-weight: 500; }
.chip.miss { background: var(--warn-tint); color: var(--warn); }
.chip.plain { background: var(--soft-bg); color: var(--muted); }
.form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.form-grid .full { grid-column: 1 / -1; }
.actions { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
details summary { cursor: pointer; color: var(--accent-ink); font-weight: 500; font-size: .92rem; }
details[open] summary { margin-bottom: 10px; }

/* To-dos */
.tasks { display: grid; }
.task { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 12px 0; border-top: 1px solid var(--line); }
.task:first-child { border-top: 0; padding-top: 2px; }
.task .what { font-weight: 500; }
.task .who { color: var(--muted); font-size: .9rem; overflow-wrap: anywhere; }
.task .why { color: var(--muted); font-size: .82rem; font-style: italic; }
.hero-why { display: block; margin-top: 6px; font-size: .9rem; color: #cfe8da; }
details.how-todos { font-size: .9rem; color: var(--muted); margin-bottom: 6px; }
details.how-todos summary { cursor: pointer; font-weight: 700; color: var(--accent-ink); }
details.how-todos ul { margin: 6px 0 0; padding-left: 18px; display: grid; gap: 3px; }
.fromlink { display: grid; gap: 6px; background: var(--tint); border-radius: 14px; padding: 14px; }
.fromlink .row { display: flex; gap: 8px; }
.fromlink .row input { flex: 1; min-width: 0; }
.fromlink .row button { white-space: nowrap; }
.or-line { text-align: center; color: var(--muted); font-size: .85rem; margin: 2px 0; }
.done { width: 22px; height: 22px; padding: 0; border-radius: 50%; border: 2px solid var(--accent); background: transparent; }
.done:hover { background: var(--tint); }
.when { font-size: .85rem; color: var(--muted); white-space: nowrap; }
.when.late { color: var(--late); font-weight: 700; }
.when.soon { color: var(--warn); font-weight: 500; }
.empty { color: var(--muted); }

/* Pipeline */
.pipe { display: grid; gap: 10px; }
.analysis { gap: 14px; }
.lead-stat { margin: 0; font-size: 1.05rem; } .lead-stat b { font-size: 1.6rem; color: var(--accent-ink); margin-right: 4px; }
.factors { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.factor { border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: grid; gap: 8px; }
.factor-h { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.tagg { font-size: .75rem; font-weight: 700; border-radius: 999px; padding: 2px 9px; background: var(--soft-bg); color: var(--muted); white-space: nowrap; }
.tagg.up { background: var(--tint); color: var(--accent-ink); }
.cmp { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr) 42px; column-gap: 10px; align-items: center; font-size: .9rem; }
.cmp small { grid-column: 1; color: var(--muted); font-size: .8rem; margin-top: -2px; }
.cmp .bar { height: 10px; border-radius: 999px; background: var(--soft-bg); overflow: hidden; }
.cmp .bar i { display: block; height: 100%; border-radius: 999px; background: var(--accent); }
.cmp b { text-align: right; }
.tips { background: var(--tint); border-radius: 14px; padding: 14px 16px; }
.tips h4 { margin: 0 0 6px; }
.tips ol { margin: 0; padding-left: 20px; display: grid; gap: 8px; }
.tips li span { display: block; color: var(--muted); font-size: .88rem; }
.pipe button { display: grid; grid-template-columns: 96px minmax(0, 1fr) 28px; gap: 10px; align-items: center; border: 0; padding: 2px 0; border-radius: 6px; background: none; text-align: left; font-weight: 400; }
.pipe button:hover .bar i { filter: brightness(1.1); }
.pipe .bar { height: 10px; border-radius: 999px; background: var(--soft-bg); overflow: hidden; }
.pipe .bar i { display: block; height: 100%; border-radius: 999px; background: var(--accent); }
.pipe .closed .bar i { background: var(--muted); opacity: .45; }
.pipe .n { font-weight: 700; text-align: right; }

.tag { display: inline-block; font-size: .72rem; font-weight: 700; letter-spacing: .03em; text-transform: uppercase; color: var(--muted); background: var(--soft-bg); border-radius: 6px; padding: 1px 7px; margin-right: 4px; vertical-align: 1px; }
.group { display: grid; gap: 4px; }
.side-col { display: grid; gap: 24px; min-width: 0; }
.links { list-style: none; padding: 0; gap: 8px; }
.links .muted { font-size: .85rem; }
.section-label.late { color: var(--late); }
.done.cal { display: inline-block; border-style: dashed; }
.pipe button { grid-template-columns: 96px minmax(0, 1fr) 28px 40px !important; }
.pipe .conv { color: var(--muted); font-size: .85rem; text-align: right; }
.kv.small { font-size: .9rem; gap: 4px 14px; border-top: 1px solid var(--line); padding-top: 12px; }
.rt { display: grid; }
.rt-h, .rt-r { display: grid; grid-template-columns: 52px minmax(0, 2fr) 110px minmax(0, 1.4fr) 120px; gap: 14px; align-items: center; }
.rt-h { font-size: .75rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 700; padding-bottom: 8px; }
.rt-r { padding: 10px 0; border-top: 1px solid var(--line); cursor: pointer; }
.rt-r:hover .rt-job b { text-decoration: underline; }
.rt-job { display: grid; min-width: 0; }
.rt-job span, .rt-c { color: var(--muted); font-size: .9rem; overflow-wrap: anywhere; }
.company-cell { display: flex; align-items: center; gap: 10px; }
.company-copy { display: grid; min-width: 0; }
.company-copy b, .company-copy span { overflow-wrap: anywhere; }
.rt-c .when { font-size: .9rem; }
.rt-r > button { justify-self: end; white-space: nowrap; }
.m-lbl { display: none; }
.acct { width: 38px; height: 38px; padding: 0; border-radius: 50%; background: var(--tint); color: var(--accent-ink); border: 0; font-weight: 700; flex: none; }
.acct.signin { width: auto; border-radius: 999px; padding: 0 14px; }
#syncState { color: var(--muted); }
.check { display: flex; gap: 10px; align-items: center; font-weight: 500; }
.check input { width: 18px; height: 18px; accent-color: var(--accent); }

/* Guide, quick add, boosts, board */
.guide { background: var(--tint); border-color: transparent; }
.gbar { height: 6px; border-radius: 999px; background: color-mix(in srgb, var(--accent) 18%, transparent); overflow: hidden; }
.gbar i { display: block; height: 100%; background: var(--accent); border-radius: 999px; }
.gsteps { list-style: none; padding: 0; margin: 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.gsteps li { display: grid; gap: 8px; align-content: start; background: var(--card); border-radius: 12px; padding: 14px; }
.gsteps li div { display: grid; gap: 2px; }
.gsteps li div span { color: var(--muted); font-size: .88rem; }
.gsteps li.ok { opacity: .7; }
.gsteps li.ok b { text-decoration: line-through; text-decoration-color: var(--muted); }
.gsteps li.next { box-shadow: 0 0 0 2px var(--accent); }
.gsteps li > button { justify-self: start; }
.gdot { width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--accent); display: grid; place-items: center; font-size: .8rem; font-weight: 700; color: var(--on-accent); }
.gsteps li.ok .gdot { background: var(--accent); }
.quick textarea { font-size: .92rem; }
.url-import { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: center; }
.url-import button { white-space: nowrap; }
.quick details { border-top: 1px solid var(--line); padding-top: 12px; }
.import-note { font-size: .8rem; color: var(--muted); line-height: 1.4; }
.import-review { color: var(--warn); background: var(--warn-tint); border-radius: 10px; padding: 9px 12px; font-size: .88rem; font-weight: 500; }
label.needs-review { color: var(--warn); }
label.needs-review input, label.needs-review select { border-color: var(--warn); box-shadow: 0 0 0 2px var(--warn-tint); }
label.needs-review::after { content: "Needs review"; color: var(--warn); font-size: .78rem; font-weight: 700; }
.extra-fields { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
.extra-fields > summary { font-size: 1rem; }
.extra-fields[open] > summary { border-bottom: 1px solid var(--line); padding-bottom: 10px; }
.extra-fields .form-grid { margin-top: 14px; }
.task .draft { margin-top: 6px; }
.boosts { display: grid; }
.boost { display: grid; grid-template-columns: 52px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); }
.boost:first-child { border-top: 0; padding-top: 0; }
.gain { font-weight: 700; color: var(--accent-ink); background: var(--tint); border-radius: 8px; text-align: center; padding: 4px 0; }
.controls.board-c { grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); }
.board { display: grid; grid-template-columns: repeat(4, minmax(180px, 1fr)) minmax(170px, .9fr); gap: 12px; overflow-x: auto; padding-bottom: 4px; }
.bcol { background: var(--soft-bg); border-radius: 14px; padding: 10px; display: flex; flex-direction: column; gap: 8px; min-height: 220px; border: 2px dashed transparent; }
.bcol.over { border-color: var(--accent); background: var(--tint); }
.bcol h4 { margin: 2px 4px 4px; font-size: .95rem; display: flex; justify-content: space-between; }
.bcol h4 span { color: var(--muted); font-weight: 500; }
.bcol.closed .bcard { opacity: .7; }
.bcard { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px; display: grid; gap: 6px; cursor: grab; }
.bcard:hover { box-shadow: var(--shadow); }
.bcard.dragging { opacity: .4; }
.bc-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
.bc-top .score { width: auto; height: auto; min-width: 34px; padding: 2px 8px; border-radius: 999px; font-size: .82rem; }
.bc-top b { font-size: .95rem; line-height: 1.3; min-width: 0; overflow-wrap: break-word; }
.company-line { display: flex; align-items: center; gap: 9px; min-width: 0; }
.company-logo { display: inline-grid; place-items: center; width: 36px; height: 36px; flex: 0 0 36px; overflow: hidden; border: 1px solid var(--line); border-radius: 6px; background: #fff; color: var(--ink); }
.company-logo.small { width: 30px; height: 30px; flex-basis: 30px; border-radius: 5px; }
.company-logo.large { width: 56px; height: 56px; flex-basis: 56px; border-radius: 8px; }
.company-logo img, .company-logo .company-initials { grid-area: 1 / 1; width: 100%; height: 100%; }
.company-logo img { display: block; object-fit: contain; padding: 5px; background: #fff; }
.company-logo .company-initials { display: grid; place-items: center; background: color-mix(in srgb, var(--yellow) 24%, #fff); color: var(--ink); font-size: .72rem; font-weight: 800; letter-spacing: .02em; }
.company-logo.large .company-initials { font-size: 1rem; }
.bc-t { color: var(--muted); font-size: .85rem; line-height: 1.35; }
.bc-meta { font-size: .82rem; color: var(--muted); }
.bc-move { display: none; }
.bempty { color: var(--muted); font-size: .85rem; margin: 4px; }

/* Job rows */
.controls { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr) minmax(0, 1fr); gap: 10px; }
.jobs { display: grid; gap: 10px; }
.jobs-card { gap: 14px; }
.ftabs { display: flex; flex-wrap: wrap; gap: 6px; }
.ftabs button { border-radius: 999px; padding: 7px 14px; font-weight: 600; background: var(--soft-bg); border: 1px solid transparent; color: var(--ink); }
.ftabs button span { color: var(--muted); font-weight: 500; margin-left: 2px; }
.ftabs button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }
.ftabs button[aria-pressed="true"] span { color: inherit; opacity: .85; }
.jtools { display: flex; gap: 10px; align-items: center; }
.jtools input { flex: 1; min-width: 0; }
.jobs-card > .count { margin: 0; }
.show-s { display: none; }
.jt { display: grid; }
.jt-h, .jt-r { display: grid; grid-template-columns: 64px minmax(0, 2.2fr) 140px minmax(0, 1.1fr) 110px minmax(0, 1.5fr); gap: 14px; align-items: center; }
.jt-h { padding: 0 10px 8px; border-bottom: 1px solid var(--line); }
.jt-h .th { background: none; border: 0; padding: 4px 0; text-align: left; font-size: .78rem; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 700; border-radius: 4px; }
.jt-h .th:hover, .jt-h .th.on { color: var(--accent-ink); }
.jt-r { padding: 12px 10px; border-bottom: 1px solid var(--line); cursor: pointer; border-radius: 10px; }
.jt-r:hover { background: var(--soft-bg); }
.jt-job { display: grid; min-width: 0; }
.jt-job b { font-size: 1.02rem; overflow-wrap: anywhere; }
.jt-job span { color: var(--muted); font-size: .9rem; overflow-wrap: anywhere; }
.fit { font-style: normal; font-weight: 600; color: var(--accent-ink); }
.fit.mid { color: var(--warn); } .fit.low { color: var(--muted); }
.jt-c { font-size: .92rem; display: grid; min-width: 0; overflow-wrap: anywhere; }
.jt-c small { color: var(--muted); font-size: .82rem; }
.jt-c small.mine, .jt-job .mine-s { color: var(--accent-ink); font-weight: 600; font-size: .82rem; }
.jt-job .mine-s { display: none; }
select.st { width: 100%; border-radius: 999px; padding: 6px 10px; font-size: .88rem; font-weight: 700; border: 0; background-color: var(--soft-bg); color: var(--ink); }
select.st-saved { background-color: #e8eef7; color: #2c4a73; }
select.st-applied { background-color: var(--warn-tint); color: var(--warn); }
select.st-interviewing { background-color: #ece6f6; color: #5b3f8c; }
select.st-offer { background-color: var(--tint); color: var(--accent-ink); }
select.st-rejected, select.st-withdrawn { background-color: var(--soft-bg); color: var(--muted); }
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin: 0; }
.facts div { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; display: grid; gap: 2px; min-width: 0; }
.facts dt { font-size: .75rem; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 700; }
.facts dd { margin: 0; font-weight: 600; overflow-wrap: anywhere; }
.facts dd small { display: block; font-weight: 400; color: var(--muted); font-size: .85rem; }
.job { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 8px 16px; align-items: center; padding: 14px 16px; border: 1px solid var(--line); border-radius: 14px; background: var(--card); cursor: pointer; }
.job:hover { box-shadow: var(--shadow); }
.job .co { font-weight: 700; font-size: 1.05rem; overflow-wrap: anywhere; }
.job .ti { color: var(--muted); font-size: .92rem; overflow-wrap: anywhere; }
.job .nx { font-size: .9rem; overflow-wrap: anywhere; margin-top: 2px; }
.job .nx .lbl { color: var(--muted); }
.job select { width: auto; padding: 6px 10px; font-size: .88rem; border-radius: 999px; }
.mini { display: grid; gap: 8px; }
.mini .job { padding: 12px 14px; }
.score { display: inline-grid; place-items: center; width: 46px; height: 46px; border-radius: 50%; font-weight: 700; font-size: 1.05rem; background: var(--tint); color: var(--accent-ink); flex: none; }
.score.mid { background: var(--warn-tint); color: var(--warn); }
.score.low { background: var(--soft-bg); color: var(--muted); }
.score.none { background: transparent; border: 1px dashed var(--line); color: var(--muted); font-weight: 500; }
.count { color: var(--muted); font-size: .9rem; }

/* Job page */
.back { font-size: .95rem; }
.job-head { display: flex; justify-content: space-between; gap: 16px; align-items: flex-start; flex-wrap: wrap; }
.job-head .sub { color: var(--muted); margin-top: 4px; }
.job-head .right { display: flex; gap: 10px; align-items: center; }
.job-head select { width: auto; border-radius: 999px; padding: 8px 12px; }
.job-identity { display: flex; align-items: center; gap: 16px; min-width: 0; }
.job-identity > div { min-width: 0; }
.seg { display: inline-flex; gap: 4px; background: var(--soft-bg); border-radius: 999px; padding: 4px; flex-wrap: wrap; }
.seg a { text-decoration: none; color: var(--muted); padding: 7px 16px; border-radius: 999px; font-weight: 500; white-space: nowrap; }
.seg a[aria-current="page"] { background: var(--card); color: var(--ink); font-weight: 700; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
.ring-wrap { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 24px; align-items: center; }
.ring { position: relative; width: 132px; height: 132px; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring .num { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; line-height: 1; }
.ring .num b { font-size: 2.4rem; letter-spacing: -0.03em; display: block; }
.ring .num small { color: var(--muted); font-size: .8rem; }
.verdict { font-size: 1.3rem; font-weight: 700; }
.rows { display: grid; gap: 16px; }
.row { display: grid; gap: 6px; }
.row-h { display: flex; justify-content: space-between; gap: 12px; font-weight: 500; }
.row-h span { color: var(--muted); font-weight: 500; white-space: nowrap; }
.row .bar { height: 8px; border-radius: 999px; background: var(--soft-bg); overflow: hidden; }
.row .bar i { display: block; height: 100%; background: var(--accent); border-radius: 999px; }
.row p { color: var(--muted); font-size: .9rem; }
.kv { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 8px 18px; font-size: .95rem; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; overflow-wrap: anywhere; white-space: pre-wrap; }
.ai-tag { display: inline-block; background: var(--tint); color: var(--accent-ink); font-size: .75rem; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; padding: 2px 8px; border-radius: 6px; }
.ai-tag.rule { background: var(--soft-bg); color: var(--muted); }
.out { background: var(--soft-bg); border-radius: 12px; padding: 14px 16px; display: grid; gap: 8px; }
.out .txt { white-space: pre-wrap; }
.out .before { color: var(--muted); font-size: .88rem; }
.out-h { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.section-label { font-size: .78rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 700; }
.spinner { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--line); border-top-color: var(--accent); display: inline-block; vertical-align: -3px; }
@media (prefers-reduced-motion: no-preference) { .spinner { animation: spin .8s linear infinite; } }
@keyframes spin { to { transform: rotate(360deg); } }

/* Modal */
.overlay { position: fixed; inset: 0; z-index: 50; background: color-mix(in srgb, var(--ink) 40%, transparent); display: flex; align-items: flex-start; justify-content: center; overflow-y: auto; padding: max(24px, env(safe-area-inset-top, 0px)) max(12px, env(safe-area-inset-right, 0px)) 24px max(12px, env(safe-area-inset-left, 0px)); }
.modal { background: var(--card); border-radius: 18px; width: 100%; max-width: 640px; box-shadow: var(--shadow); }
.modal-h { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 22px 24px 6px; }
.modal-h h2 { font-size: 1.4rem; }
.modal-b { padding: 12px 24px 8px; display: grid; gap: 20px; }
.modal-f { display: flex; flex-wrap: wrap; gap: 10px; justify-content: flex-end; align-items: center; padding: 16px 24px 22px; }
.modal-f .left { margin-right: auto; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.x { border: 0; background: none; font-size: 1.2rem; color: var(--muted); padding: 4px 8px; }
.paste { display: grid; gap: 10px; background: var(--soft-bg); border-radius: 14px; padding: 16px; }
.err { color: var(--late); font-size: .9rem; }
.note { font-size: .85rem; color: var(--muted); }

.toast { position: fixed; z-index: 60; left: 50%; transform: translateX(-50%); bottom: calc(20px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 12px; display: flex; gap: 12px; align-items: center; box-shadow: var(--shadow); max-width: calc(100% - 32px); }
.toast button { background: transparent; color: var(--bg); border-color: color-mix(in srgb, var(--bg) 40%, transparent); padding: 4px 12px; }

footer { padding-block: 0 40px; color: var(--muted); font-size: .88rem; }
footer .wrap { display: flex; flex-wrap: wrap; gap: 6px 16px; }

@media (max-width: 860px) {
  .gsteps { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .grid2 { grid-template-columns: minmax(0, 1fr); }
  .hero { padding: 24px 20px; gap: 20px; border-radius: 20px; }
  .hero-stats { gap: 6px; } .hero-stats a { padding: 10px 12px; } .hero-stats b { font-size: 1.6rem; } .hero-stats span { font-size: .85rem; } .hero-stats small { display: none; }
  .hero h2 { font-size: 1.8rem; }
  .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 600px) {
  h2 { font-size: 1.7rem; }
  .top-in { flex-wrap: wrap; gap: 8px 12px; }
  .tabs { order: 3; width: 100%; overflow-x: auto; }
  .tabs { justify-content: space-between; gap: 0; }
  .tabs a { padding: 6px 9px; font-size: .95rem; }
  .form-grid, .controls { grid-template-columns: minmax(0, 1fr); }
  .job { grid-template-columns: auto minmax(0, 1fr); }
  .job > select { grid-column: 2; justify-self: start; }
  .mini .job > .count { display: none; }
  .rt-h { display: none; }
  .gsteps { grid-template-columns: minmax(0, 1fr); }
  .board { grid-template-columns: repeat(5, minmax(220px, 82%)); scroll-snap-type: x mandatory; }
  .bcol { scroll-snap-align: start; }
  .bc-move { display: block; width: 100%; padding: 6px 10px; font-size: .85rem; border-radius: 8px; }
  .controls.board-c { grid-template-columns: minmax(0, 1fr); }
  .jt-h .hide-s, .jt-r .hide-s { display: none; }
  .factors { grid-template-columns: minmax(0, 1fr); }
  .jt-job .mine-s { display: block; }
  .jt-h { display: none; }
  .jt-r { grid-template-columns: auto minmax(0, 1fr); gap: 4px 12px; padding: 12px 4px; }
  .jt-r > :first-child { grid-row: span 3; align-self: start; }
  .jt-r select.st { width: auto; }
  .jtools { flex-wrap: wrap; }
  .jtools input { flex: 1 1 100%; }
  .jtools .show-s { display: block; width: 100%; }
  .boost { grid-template-columns: 48px minmax(0, 1fr); }
  .boost > button { grid-column: 2; justify-self: start; }
  .m-lbl { display: inline; }
  .rt-r { grid-template-columns: 52px minmax(0, 1fr); gap: 4px 12px; }
  .rt-r > .rt-c, .rt-r > button { grid-column: 2; justify-self: start; }
  .task { grid-template-columns: auto minmax(0, 1fr); }
  .task .when { grid-column: 2; }
  .ring-wrap { grid-template-columns: minmax(0, 1fr); justify-items: start; }
  .card { padding: 18px; }
  .stat b { font-size: 1.7rem; }
}
@media (prefers-reduced-motion: no-preference) { .job, button { transition: box-shadow .15s, border-color .15s, background-color .15s; } }
@media (max-width: 560px) { .url-import { grid-template-columns: 1fr; } .url-import button { justify-self: start; } }

/* Vanta-inspired visual refresh: cool paper, editorial spacing, restrained primary colors. */
:root,
:root[data-theme="dark"] {
  --bg: #eef0ee;
  --card: #fafafa;
  --soft-bg: #f0f1ee;
  --ink: #14291f;
  --muted: #66716a;
  --line: #dde0dc;
  --accent: #154734;
  --accent-ink: #154734;
  --on-accent: #ffffff;
  --tint: #e5eee8;
  --warn: #9a7117;
  --warn-tint: #f7edcf;
  --late: #b44550;
  --yellow: #d8ae3e;
  --blue: #2e7553;
  --shadow: 0 2px 5px rgba(20,41,31,.06), 0 18px 48px rgba(20,41,31,.08);
  color-scheme: light;
}
html { background: var(--bg); }
body { margin: 0; padding: 14px; min-height: 100vh; background: var(--bg); font-size: 15px; }
body::before { background: var(--bg); }
.site-shell {
  width: min(1220px, 100%);
  min-height: calc(100vh - 28px);
  margin: 0 auto;
  background: #fafafa;
  border: 1px solid #dfe2de;
  border-radius: 12px;
  box-shadow: var(--shadow);
}
.wrap { max-width: none; padding-inline: clamp(22px, 5vw, 70px); }
h1, h2, h3 { color: var(--ink); letter-spacing: -.035em; }
h2 { font-size: clamp(2.4rem, 5vw, 4.2rem); font-weight: 500; line-height: .98; }
h3 { font-size: 1.25rem; font-weight: 600; letter-spacing: -.025em; }
a { text-underline-offset: 3px; }

button { border-color: transparent; background: var(--soft-bg); border-radius: 5px; padding: 9px 15px; font-size: .9rem; }
button:hover { border-color: color-mix(in srgb, var(--ink) 22%, transparent); box-shadow: 0 4px 12px rgba(20,41,31,.07); }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
button.primary:hover { filter: none; background: #223149; border-color: #223149; }
button.link { color: var(--ink); font-weight: 600; }
button.small { padding: 6px 11px; font-size: .8rem; }
:focus-visible { outline-color: var(--blue); outline-width: 3px; }
input, select, textarea { background: #fff; border-color: #d9ddd9; border-radius: 6px; padding: 12px 14px; }
input:hover, select:hover, textarea:hover { border-color: #bfc5c1; }
input:focus, select:focus, textarea:focus { border-color: var(--blue); box-shadow: 0 0 0 3px color-mix(in srgb, var(--blue) 14%, transparent); outline: 0; }
label { color: var(--ink); font-weight: 600; }

/* Compact, centered masthead like the reference. */
.top { position: sticky; top: 14px; background: color-mix(in srgb, #fafafa 92%, transparent); border: 0; border-radius: 12px 12px 0 0; backdrop-filter: blur(16px); }
.top-in { min-height: 74px; display: grid; grid-template-columns: 1fr auto 1fr; gap: 24px; padding-block: 16px; }
.logo { display: inline-flex; align-items: center; gap: 9px; color: var(--ink); font-size: 1rem; font-weight: 700; letter-spacing: -.02em; white-space: nowrap; }
.logo .logo-mark { display: inline-flex; align-items: center; width: 50px; color: var(--yellow); }
.logo-mark svg { display: block; width: 100%; height: auto; overflow: visible; }
.chevrons path:nth-child(1) { opacity: .34; }
.chevrons path:nth-child(2) { opacity: .66; }
.chevrons path:nth-child(3) { opacity: 1; }
.logo-word { color: var(--ink) !important; }
.tabs { justify-content: center; gap: 2px; }
.tabs a { padding: 7px 12px; border-radius: 4px; color: #5f6874; font-size: .82rem; }
.tabs a:hover { color: var(--ink); background: transparent; }
.tabs a[aria-current="page"] { color: var(--ink); background: var(--soft-bg); font-weight: 700; }
#btnAdd { justify-self: end; margin-left: 0; }

main { padding-block: 34px 76px; gap: 42px; }
.hello { grid-template-columns: minmax(0, 1.5fr) minmax(240px, .7fr); gap: 22px 64px; align-items: end; padding: 48px 0 54px; border-bottom: 1px solid var(--line); }
.hello::before { content: attr(data-eyebrow); grid-column: 1 / -1; color: var(--muted); font-size: .73rem; font-weight: 700; letter-spacing: .04em; }
.hello h2 { max-width: 13ch; }
.hello p { color: var(--muted); font-size: 1rem; line-height: 1.45; max-width: 40ch; }

.card { background: transparent; border: 0; border-top: 1px solid var(--line); border-radius: 0; padding: 30px 0; gap: 20px; }
.card-h { align-items: center; }
.grid2 { grid-template-columns: minmax(0, 1.65fr) minmax(300px, .85fr); gap: clamp(36px, 6vw, 76px); }
.side-col { gap: 34px; }
.count { font-size: .78rem; }

/* A soft four-step panel echoes Vanta's admissions sequence. */
.guide { background: var(--soft-bg); border: 0; border-radius: 10px; padding: clamp(24px, 4vw, 40px); }
.guide .card-h { align-items: baseline; }
.gbar { height: 3px; background: #d9ddd8; }
.gbar i { background: var(--blue); }
.gsteps { gap: 0; border-top: 1px solid var(--line); }
.gsteps li { position: relative; grid-template-columns: 58px minmax(0, 1fr); gap: 10px 14px; background: transparent; border-radius: 0; padding: 20px 16px 18px 0; }
.gsteps li + li { padding-left: 16px; border-left: 1px solid var(--line); }
.gsteps li > button { grid-column: 2; }
.gsteps li.next { box-shadow: none; }
.gsteps li.next b { color: var(--ink); }
.gdot { width: 54px; height: 28px; border: 0; border-radius: 0; background: transparent !important; color: #8a9299; }
.gdot svg { display: block; width: 54px; height: 22px; overflow: visible; }
.gdot path { fill: none; stroke: currentColor; stroke-width: 1.5; vector-effect: non-scaling-stroke; }
.gsteps li.ok { opacity: 1; }
.gsteps li.ok > div { opacity: .58; }
.gsteps li.ok .gdot { color: var(--yellow); }
.gsteps li.ok .gdot path { fill: currentColor; stroke: currentColor; }

/* Dashboard content is open and editorial; the quick action remains prominent. */
.quick { background: var(--soft-bg); border: 0; border-radius: 10px; padding: 28px; }
.quick details { border-color: #d7dad6; }
.url-import { grid-template-columns: minmax(0, 1fr); }
.url-import button { justify-self: start; }
.tasks { border-bottom: 1px solid var(--line); }
.task { padding: 16px 0; }
.done { width: 28px; height: 28px; border: 1px solid #c7ccc8; }
.done:hover { border-color: var(--blue); background: color-mix(in srgb, var(--blue) 10%, transparent); }
.pipe { gap: 0; border-top: 1px solid var(--line); }
.pipe button { min-height: 48px; border-bottom: 1px solid var(--line); border-radius: 0; }
.pipe .bar { height: 5px; background: #e2e4e1; }
.pipe .bar i { background: var(--blue); }
.links { gap: 12px; }

/* Job tables and boards borrow the theme's calm list rhythm and color markers. */
.seg { background: var(--soft-bg); border-radius: 6px; padding: 3px; }
.seg a { border-radius: 4px; padding: 7px 14px; font-size: .86rem; }
.seg a[aria-current="page"] { background: #fff; box-shadow: 0 1px 3px rgba(20,41,31,.08); }
.controls { padding: 4px 0 8px; }
.board { gap: 14px; }
.bcol { --stage: var(--yellow); position: relative; background: #f3f4f1; border: 1px solid #e3e5e1; border-radius: 8px; padding: 16px 12px 12px; min-height: 270px; }
.bcol:nth-child(2) { --stage: color-mix(in srgb, var(--blue) 55%, white); }
.bcol:nth-child(3) { --stage: var(--blue); }
.bcol:nth-child(4) { --stage: var(--yellow); }
.bcol:nth-child(5) { --stage: #8a9299; }
.bcol h4 { justify-content: flex-start; gap: 8px; margin-bottom: 10px; font-size: .9rem; }
.bcol h4::before { content: ""; width: 12px; height: 12px; margin-top: 4px; flex: none; background: var(--stage); clip-path: polygon(0 35%, 57% 35%, 57% 4%, 100% 50%, 57% 96%, 57% 65%, 0 65%); }
.bcol:nth-child(2) h4::before { transform: rotate(-15deg); }
.bcol:nth-child(3) h4::before { transform: rotate(12deg); }
.bcol h4 span { margin-left: auto; }
.bcard { border-color: #e0e3df; border-radius: 7px; padding: 13px; gap: 8px; box-shadow: 0 1px 1px rgba(20,41,31,.025); }
.bcard:hover { border-color: color-mix(in srgb, var(--stage) 65%, #dfe2de); box-shadow: 0 8px 20px rgba(20,41,31,.08); transform: translateY(-1px); }
.bc-top .score { border-radius: 6px; }
.job { border-width: 0 0 1px; border-radius: 0; background: transparent; padding: 19px 4px; }
.job:first-child { border-top: 1px solid var(--line); }
.job:hover { background: var(--soft-bg); box-shadow: none; padding-inline: 12px; }
.score { background: var(--blue); color: #fff; border-radius: 50%; }
.score.mid { background: var(--yellow); color: var(--ink); }
.score.low { background: color-mix(in srgb, var(--blue) 78%, white); color: #fff; }
.score.none { background: transparent; color: var(--muted); }

/* Job detail and resume surfaces. */
.job-head { padding: 44px 0 24px; }
.job-head h2 { font-size: clamp(2.5rem, 5vw, 4.2rem); font-weight: 500; }
.job-head select { border-radius: 5px; }
.ring-wrap { gap: clamp(28px, 5vw, 58px); }
.ring { width: 150px; height: 150px; }
.out { background: var(--soft-bg); border-radius: 8px; padding: 20px; }
.row .bar { height: 5px; }
.row .bar i { background: var(--blue); }
.chip { border-radius: 3px; background: color-mix(in srgb, var(--blue) 11%, #fff); color: #2f5c9f; }
.chip.miss { background: var(--warn-tint); color: var(--warn); }
.chip.plain { background: var(--soft-bg); color: var(--muted); }

/* Forms and overlays keep every field and interaction, with quieter framing. */
.overlay { background: rgba(20,41,31,.48); padding-top: max(32px, env(safe-area-inset-top, 0px)); }
.modal { max-width: 720px; background: #fafafa; border: 1px solid rgba(255,255,255,.7); border-radius: 11px; box-shadow: 0 24px 80px rgba(20,41,31,.2); }
.modal-h { padding: 28px 30px 8px; }
.modal-h h2 { font-size: 1.65rem; font-weight: 600; }
.modal-b { padding: 18px 30px 12px; gap: 24px; }
.modal-f { padding: 18px 30px 28px; border-top: 1px solid var(--line); margin-top: 12px; }

<script>

  // ---------- What's working: compares applications that got an interview with ones that didn't ----------
  function analysisHTML() {
    var t = today();
    var sent = jobs.filter(function (o) { return o.status !== "saved" && (o.appliedDate || o.status !== "withdrawn"); });
    var heard = function (o) { return o.status === "interviewing" || o.status === "offer" || !!o.interviewDate; };
    var h = '<section class="card analysis"><div class="card-h"><h3>What\'s working</h3><span class="count">Compares applications that led to an interview with ones that didn\'t</span></div>';
    if (sent.length < 3) return h + '<p class="empty">Once you\'ve applied to 3 or more jobs, this shows what the ones that led to interviews have in common, and what to change.</p></section>';
    var wins = sent.filter(heard).length, rate = function (list) { return list.length ? Math.round(100 * list.filter(heard).length / list.length) : null; };
    var overall = rate(sent);
    // Each factor splits your applications into two groups and compares their interview rates.

      { name: "Had a network contact", yes: "With a contact", no: "Without one", c: ["with a contact", "without one"], test: function (o) { return !!o.contact; }, tip: "Find a contact (alum, recruiter, club) before you apply. Career Connections can help." },
      { name: "Tailored your resume", yes: "Tailored", no: "Not tailored", c: ["where you tailored your resume", "where you didn't"], test: function (o) { return !!(o.tailored || o.tailoring); }, tip: "Tailor your resume for every application. It takes a few minutes on each job's Tailor tab." },
      { name: "Strong match (75+)", yes: "Score 75 or higher", no: "Below 75", c: ["scoring 75+", "for lower scores"], test: function (o) { var r = scoreJob(o); return !!r && r.score >= 75; }, tip: "Spend your time on jobs that score 75 or higher, or close the skill gaps first." },
      { name: "Applied early", yes: "A week or more before it closed", no: "In the last week, or no deadline", c: ["sent a week or more early", "for later ones"], test: function (o) { return !!(o.deadline && o.appliedDate && diffDays(o.deadline, o.appliedDate) >= 7); }, tip: "Apply at least a week before the deadline. Many teams review applications as they come in." }];
    var rows = [], tips = [];
    F.forEach(function (f) {
      var a = sent.filter(f.test), b = sent.filter(function (o) { return !f.test(o); });
      if (!a.length || !b.length) return;
      var ra = rate(a), rb = rate(b), gap = ra - rb;

      if (gap >= 15) tips.push({ gap: gap, text: f.tip, why: "applications " + f.c[0] + " got an interview " + ra + "% of the time, vs " + rb + "% " + f.c[1] });
    });
    rows.sort(function (x, y) { return Math.abs(y.gap) - Math.abs(x.gap); });
    var bar = function (label, list, pct) { return '<div class="cmp"><span>' + label + '</span><span class="bar"><i style="width:' + Math.max(pct ? 4 : 0, pct) + '%"></i></span><b>' + pct + '%</b><small>' + list.filter(heard).length + " of " + list.length + "</small></div>"; };
    h += '<p class="lead-stat"><b>' + overall + "%</b> of your applications led to an interview (" + wins + " of " + sent.length + ").</p>";
    h += '<div class="factors">' + rows.map(function (r) {

      return '<div class="factor"><div class="factor-h"><b>' + r.f.name + "</b>" + verdictTxt + "</div>" + bar(r.f.yes, r.a, r.ra) + bar(r.f.no, r.b, r.rb) + "</div>";

    var gaps = Object.keys(miss).filter(function (k) { return miss[k] >= 2; }).sort(function (a, b) { return miss[b] - miss[a]; }).slice(0, 4);
    if (gaps.length) tips.push({ gap: 0, text: "Build or show these skills: " + gaps.join(", ") + ".", why: "postings where you didn't hear back asked for them and your resume doesn't show them (" + gaps.map(function (k) { return k + " in " + miss[k]; }).join(", ") + ")" });
    var stale = sent.filter(function (o) { return o.status === "applied" && o.appliedDate && diffDays(t, o.appliedDate) >= 21; }).length;
    if (stale) tips.push({ gap: 0, text: "Follow up on " + plural(stale, "application") + " with no reply after 3+ weeks.", why: "a short follow-up email often gets a stalled application looked at" });

    return h + '<p class="note">Rule-based, not AI. Based on ' + plural(sent.length, "application") + ", so treat small differences with caution; patterns get more reliable as you apply to more jobs.</p></section>";
  }

  // ---------- Progress: the in-depth view ----------

  // ---------- Events ----------
  function toggleSamples() {
    if (jobs.some(function (o) { return o.sample; })) {
      var removed = jobs.filter(function (o) { return o.sample; });
      jobs = jobs.filter(function (o) { return !o.sample; }); save(); go("#dashboard");
      toast("Sample jobs removed.", "Undo", function () { jobs = removed.concat(jobs); save(); render(); });
    } else { ui.skippedWelcome = true; jobs = samples().concat(jobs); save(); render(); toast("Added 6 sample jobs. Remove them any time at the bottom of the page."); }
  }
  document.addEventListener("click", function (e) {
    var t = e.target;
    var am = t.closest("[data-auth]"); if (am) { e.preventDefault(); ui.authMode = am.dataset.auth; render(); return; }
    if (t.closest("#btnAcct")) { if (session) go("#resume"); else { setGuest(false); ui.authMode = "in"; render(); } return; }
    if (t.closest("[data-act='guest']")) { setGuest(true); ui.skippedWelcome = false; load(); render(); return; }
    if (t.closest("#btnAdd") || t.closest("[data-act='add']")) { openJob(null); return; }
    if (t.closest("#btnSamples") || t.closest("[data-act='samples']")) { toggleSamples(); return; }
    if (t.closest("[data-act='sample-all']")) { me = sampleProfile(); saveMe(); jobs = samples().concat(jobs); save(); go("#dashboard"); toast("Loaded a sample resume and 6 sample jobs."); return; }
    if (t.closest("[data-act='skip']")) { ui.skippedWelcome = true; go("#dashboard"); return; }
    var mo = t.closest("[data-more]"); if (mo) { ui.more[mo.dataset.more] = !ui.more[mo.dataset.more]; if (route().tab === "jobs") renderJobList(); else render(); return; }
    if (t.closest("[data-act='all-steps']")) { ui.showAll = !ui.showAll; render(); return; }
    var em = t.closest("[data-email]"); if (em) { openEmail(em.dataset.id, em.dataset.email); return; }
    var vw = t.closest("[data-view]"); if (vw) { e.preventDefault(); ui.view = vw.dataset.view; render(); return; }
    var ask = t.closest("[data-addskill]"); if (ask) {
      var jid = route().id, before = (scoreJob(byId(jid)) || {}).score;
      me.skills = splitList(me.skills).concat([ask.dataset.addskill]).join(", "); saveMe(); render();
      toast("Added " + esc(ask.dataset.addskill) + " to your skills. Score " + before + " → " + ((scoreJob(byId(jid)) || {}).score) + ". Make sure it's on your resume too."); return; }
    if (t.closest("[data-act='guide-hide']")) { try { localStorage.setItem("nextmove.v3.hideGuide", "1"); } catch (x) {} render(); return; }
    if (t.closest("[data-act='focus-qa']")) { var qa = $("#qaUrl") || $("#qa"); if (qa) { qa.scrollIntoView({ block: "center" }); qa.focus(); } else openJob(null); return; }
    var c = t.closest("[data-copy]"); if (c) { (navigator.clipboard ? navigator.clipboard.writeText(c.dataset.copy) : Promise.reject()).then(function () { toast("Copied."); }, function () { toast("Couldn't copy. Select the text instead."); }); return; }
    var d = t.closest("[data-done]"); if (d) { completeStep(d.dataset.done, d.dataset.id); return; }
    var ed = t.closest("[data-edit]"); if (ed) { openJob(ed.dataset.edit, ed.dataset.focus); return; }
    var f = t.closest("[data-filter]"); if (f) { ui.filter = f.dataset.filter; ui.view = "list"; go("#jobs"); return; }
    var ft = t.closest("[data-ftab]"); if (ft) { ui.filter = ft.dataset.ftab; ui.more.list = false; render(); return; }
    var sb = t.closest("[data-sortby]"); if (sb) { var k2 = sb.dataset.sortby, cur = ui.dir || (ui.sort === "score" || ui.sort === "updated" ? -1 : 1);
      ui.dir = ui.sort === k2 ? -cur : (k2 === "score" ? -1 : 1); ui.sort = k2; renderJobList(); return; }
    if (t.closest("select") || t.closest("a") || t.closest(".modal")) return;
    var g = t.closest("[data-go]"); if (g) go(g.dataset.go);
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Enter" && e.target.classList && (e.target.classList.contains("job") || e.target.classList.contains("bcard") || e.target.classList.contains("rt-r"))) go(e.target.dataset.go);
  });
  document.addEventListener("change", function (e) {
    var t = e.target;
    if (t.dataset.status) {
      var o = byId(t.dataset.status); if (o) changeStatus(o, t.value);
      return;
    }
    if (t.id === "filter") { ui.filter = t.value; renderJobList(); }
    if (t.id === "sort") { ui.sort = t.value; ui.dir = 0; renderJobList(); }
  });
  document.addEventListener("input", function (e) { if (e.target.id === "q") { ui.q = e.target.value; renderJobList(); } });
  // Board drag and drop
  document.addEventListener("dragstart", function (e) {
    var card = e.target.closest && e.target.closest(".bcard"); if (!card) return;
    e.dataTransfer.setData("text/plain", card.dataset.id); e.dataTransfer.effectAllowed = "move"; card.classList.add("dragging");
  });
  document.addEventListener("dragend", function () { $all(".bcard.dragging, .bcol.over").forEach(function (el) { el.classList.remove("dragging", "over"); }); });
  document.addEventListener("dragover", function (e) {
    var col = e.target.closest && e.target.closest(".bcol"); if (!col) return;
    e.preventDefault(); $all(".bcol.over").forEach(function (el) { if (el !== col) el.classList.remove("over"); }); col.classList.add("over");
  });
  document.addEventListener("drop", function (e) {
    var col = e.target.closest && e.target.closest(".bcol"); if (!col) return;
    e.preventDefault(); col.classList.remove("over");
    var o = byId(e.dataTransfer.getData("text/plain")), st = col.dataset.col; if (!o) return;
    if (st === "closed") { if (!CLOSED[o.status]) changeStatus(o, "rejected"); } else changeStatus(o, st);
  });
  window.addEventListener("hashchange", function () { closeModal(); render(); window.scrollTo(0, 0); });

  // Boot: with accounts on, show the cached copy right away, then load the latest from the account.
  if (AUTH) { try { session = JSON.parse(localStorage.getItem(SESSION_KEY) || "null"); } catch (e) { session = null; } }
  if (AUTH && !session) { try { guest = localStorage.getItem(GUEST_KEY) === "1"; } catch (e) {} }
  load();
  render();
  if (session) pull();
  document.addEventListener("visibilitychange", function () { if (document.visibilityState === "visible" && session && !sync.dirty) pull(true); });
  window.addEventListener("pagehide", function () { if (sync.dirty) pushNow(); });
})();
</script>
</body>
</html>
