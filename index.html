<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Next Move Job Tracker</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap">
<style>
/* Layout: one calm column. Resume-first welcome, then a personal home: next steps, then your jobs. */
:root {
  --bg: #fbfaf6; --card: #ffffff; --soft-bg: #f3f1ea; --ink: #1f2a24; --muted: #66736b; --line: #e7e4dc;
  --accent: #3f7d5c; --accent-ink: #2d5d44; --on-accent: #ffffff; --tint: #e3efe7;
  --warn: #9a6a12; --warn-tint: #f6ecd6; --late: #b5462f;
  --shadow: 0 1px 2px rgba(31,42,36,.05), 0 10px 30px rgba(31,42,36,.08);
  --font: "DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #141815; --card: #1b201c; --soft-bg: #222823; --ink: #e8ece9; --muted: #9eaaa2; --line: #2c332e;
  --accent: #6fbf94; --accent-ink: #8fd3ad; --on-accent: #0f1a14; --tint: #20372a;
  --warn: #e3b55a; --warn-tint: #3a3020; --late: #f08a70;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 30px rgba(0,0,0,.35);
  color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #141815; --card: #1b201c; --soft-bg: #222823; --ink: #e8ece9; --muted: #9eaaa2; --line: #2c332e;
  --accent: #6fbf94; --accent-ink: #8fd3ad; --on-accent: #0f1a14; --tint: #20372a;
  --warn: #e3b55a; --warn-tint: #3a3020; --late: #f08a70;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 30px rgba(0,0,0,.35);
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 16px; line-height: 1.55; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.wrap { max-width: 760px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1, h2, h3 { margin: 0; line-height: 1.2; text-wrap: balance; }
h2 { font-size: 2rem; font-weight: 700; letter-spacing: -0.02em; }
h3 { font-size: 1.1rem; font-weight: 700; }
p { margin: 0; }
.muted { color: var(--muted); }
a { color: var(--accent-ink); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 8px 16px; font-weight: 500; }
button:hover { border-color: var(--muted); }
button.primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); font-weight: 700; }
button.primary:hover { filter: brightness(1.07); }
button.link { border: 0; background: none; padding: 0; color: var(--accent-ink); font-weight: 500; border-radius: 0; }
button.link:hover { text-decoration: underline; }
button.danger { color: var(--late); }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, .job:focus-visible, .drop:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
input, select, textarea { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; width: 100%; min-width: 0; }
textarea { resize: vertical; }
label { display: grid; gap: 6px; font-size: .9rem; font-weight: 500; }
label .hint { font-weight: 400; color: var(--muted); font-size: .85rem; }

/* Header */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); }
.top-in { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 16px; }
.logo { font-weight: 700; font-size: 1.2rem; letter-spacing: -0.01em; }
.logo span { color: var(--accent); }
.top-actions { display: flex; gap: 10px; align-items: center; }
.me { min-width: 38px; height: 38px; padding: 0 12px; border-radius: 999px; background: var(--tint); color: var(--accent-ink); border: 0; font-weight: 700; }

main { padding-block: 16px 48px; display: grid; gap: 28px; }
.hello { display: grid; gap: 6px; }
.hello p { color: var(--muted); font-size: 1.05rem; }

.card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 22px; display: grid; gap: 14px; min-width: 0; }
.card-h { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }

/* Welcome */
.welcome { display: grid; gap: 20px; padding-block: 24px; }
.welcome h2 { font-size: 2.2rem; }
.welcome .lead { color: var(--muted); font-size: 1.1rem; max-width: 52ch; }
.drop { position: relative; display: grid; gap: 6px; justify-items: center; text-align: center; border: 2px dashed var(--line); border-radius: 16px; padding: 36px 20px; background: var(--card); cursor: pointer; font-weight: 400; font-size: 1rem; }
.drop:hover, .drop.over { border-color: var(--accent); background: var(--tint); }
.drop strong { font-size: 1.1rem; }
.drop input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
.drop .btnlike { margin-top: 8px; background: var(--accent); color: var(--on-accent); border-radius: 999px; padding: 9px 18px; font-weight: 700; }
.status:empty { display: none; }
.status.err { color: var(--late); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { background: var(--tint); color: var(--accent-ink); border-radius: 999px; padding: 3px 10px; font-size: .85rem; font-weight: 500; }
.chip.miss { background: var(--warn-tint); color: var(--warn); }
.form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.form-grid .full { grid-column: 1 / -1; }
.actions { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }

/* Next steps */
.tasks { display: grid; }
.task { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 12px 0; border-top: 1px solid var(--line); }
.task:first-child { border-top: 0; padding-top: 2px; }
.task .what { font-weight: 500; }
.task .who { color: var(--muted); font-size: .9rem; overflow-wrap: anywhere; }
.done { width: 22px; height: 22px; padding: 0; border-radius: 50%; border: 2px solid var(--accent); background: transparent; }
.done:hover { background: var(--tint); }
.when { font-size: .85rem; color: var(--muted); white-space: nowrap; }
.when.late { color: var(--late); font-weight: 700; }
.when.soon { color: var(--warn); font-weight: 500; }
.empty { color: var(--muted); }

/* Jobs */
.controls { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr) minmax(0, 1fr); gap: 10px; }
.jobs { display: grid; gap: 10px; }
.job { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px 16px; padding: 16px; border: 1px solid var(--line); border-radius: 14px; background: var(--card); cursor: pointer; }
.job:hover { box-shadow: var(--shadow); }
.job .co { font-weight: 700; font-size: 1.05rem; overflow-wrap: anywhere; }
.job .ti { color: var(--muted); font-size: .92rem; overflow-wrap: anywhere; }
.job .nx { font-size: .9rem; overflow-wrap: anywhere; margin-top: 4px; }
.job .nx .lbl { color: var(--muted); }
.job .side { display: grid; gap: 8px; justify-items: end; align-content: start; }
.job select { width: auto; padding: 6px 10px; font-size: .88rem; border-radius: 999px; }
.badge { border-radius: 999px; padding: 3px 10px; font-size: .82rem; font-weight: 700; white-space: nowrap; background: var(--tint); color: var(--accent-ink); }
.badge.mid { background: var(--warn-tint); color: var(--warn); }
.badge.low { background: var(--soft-bg); color: var(--muted); }
.count { color: var(--muted); font-size: .9rem; }

/* Modal */
.overlay { position: fixed; inset: 0; z-index: 50; background: color-mix(in srgb, var(--ink) 40%, transparent); display: flex; align-items: flex-start; justify-content: center; overflow-y: auto; padding: max(24px, env(safe-area-inset-top, 0px)) max(12px, env(safe-area-inset-right, 0px)) 24px max(12px, env(safe-area-inset-left, 0px)); }
.modal { background: var(--card); border-radius: 18px; width: 100%; max-width: 620px; box-shadow: var(--shadow); }
.modal-h { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 22px 24px 6px; }
.modal-h h2 { font-size: 1.4rem; }
.modal-b { padding: 12px 24px 8px; display: grid; gap: 20px; }
.modal-f { display: flex; flex-wrap: wrap; gap: 10px; justify-content: flex-end; align-items: center; padding: 16px 24px 22px; }
.modal-f .left { margin-right: auto; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.x { border: 0; background: none; font-size: 1.2rem; color: var(--muted); padding: 4px 8px; }
.paste { display: grid; gap: 10px; background: var(--soft-bg); border-radius: 14px; padding: 16px; }
.match-box { display: grid; gap: 8px; }
.match-box p { font-size: .92rem; }
.section-label { font-size: .78rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 700; }
.err { color: var(--late); font-size: .9rem; }
.note { font-size: .82rem; color: var(--muted); }

.toast { position: fixed; z-index: 60; left: 50%; transform: translateX(-50%); bottom: calc(20px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 12px; display: flex; gap: 12px; align-items: center; box-shadow: var(--shadow); max-width: calc(100% - 32px); }
.toast button { background: transparent; color: var(--bg); border-color: color-mix(in srgb, var(--bg) 40%, transparent); padding: 4px 12px; }

footer { padding-block: 0 40px; color: var(--muted); font-size: .88rem; }
footer .wrap { display: flex; flex-wrap: wrap; gap: 6px 16px; }

@media (max-width: 600px) {
  h2 { font-size: 1.7rem; }
  .welcome h2 { font-size: 1.9rem; }
  .form-grid, .controls { grid-template-columns: minmax(0, 1fr); }
  .job { grid-template-columns: minmax(0, 1fr); }
  .job .side { justify-items: start; grid-auto-flow: column; justify-content: start; align-items: center; }
  .task { grid-template-columns: auto minmax(0, 1fr); }
  .task .when { grid-column: 2; }
  #btnAdd { padding: 8px 12px; }
}
@media (prefers-reduced-motion: no-preference) { .job, button { transition: box-shadow .15s, border-color .15s, background-color .15s; } }
</style>
</head>
<body>

<header class="top">
  <div class="wrap top-in">
    <div class="logo">Next<span>Move</span></div>
    <div class="top-actions">
      <button id="btnAdd" class="primary" type="button" hidden>+ Add a job</button>
      <button id="btnMe" class="me" type="button" title="Me and my resume" aria-label="Me and my resume" hidden>Me</button>
    </div>
  </div>
</header>

<main class="wrap" id="view"></main>

<footer><div class="wrap">
  <span>Saved privately in this browser on this device. Nothing is uploaded, not even your resume.</span>
  <button type="button" class="link" id="btnSamples" hidden></button>
</div></footer>

<div id="modalRoot"></div>
<div id="toastRoot"></div>

<script>
(function () {
  "use strict";
  var KEY = "nextmove.v2.jobs", PROFILE_KEY = "nextmove.v2.me";
  var STATUSES = [["saved", "Saved"], ["applied", "Applied"], ["interviewing", "Interviewing"], ["offer", "Offer"], ["rejected", "Rejected"], ["withdrawn", "Withdrawn"]];
  var CLOSED = { rejected: 1, withdrawn: 1 };
  var FOLLOW_UP_DAYS = 14; // Career Services guide: reach out two weeks after applying

  // ---------- Dates ----------
  function pad(n) { return (n < 10 ? "0" : "") + n; }
  function iso(d) { return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
  function today() { return iso(new Date()); }
  function parseISO(s) { var p = s.split("-"); return new Date(+p[0], +p[1] - 1, +p[2]); }
  function addDays(s, n) { var d = parseISO(s); d.setDate(d.getDate() + n); return iso(d); }
  function diffDays(a, b) { return Math.round((parseISO(a) - parseISO(b)) / 86400000); }
  var MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
  function fmt(s) { if (!s) return ""; var d = parseISO(s); return MONTHS[d.getMonth()] + " " + d.getDate(); }
  function when(s) {
    if (!s) return "";
    var n = diffDays(s, today()), txt, cls = "when";
    if (n < 0) { txt = (n === -1 ? "1 day" : -n + " days") + " late"; cls += " late"; }
    else if (n === 0) { txt = "today"; cls += " soon"; }
    else if (n === 1) { txt = "tomorrow"; cls += " soon"; }
    else if (n < 7) txt = "in " + n + " days";
    else txt = fmt(s);
    return '<span class="' + cls + '">' + txt + "</span>";
  }

  // ---------- Utils ----------
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
  function $(s, r) { return (r || document).querySelector(s); }
  function $all(s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); }
  function statusLabel(id) { for (var i = 0; i < STATUSES.length; i++) if (STATUSES[i][0] === id) return STATUSES[i][1]; return id; }
  function splitList(s) { return String(s || "").split(/[,;\n]/).map(function (x) { return x.trim(); }).filter(Boolean); }

  // ---------- Storage ----------
  var jobs = [], me = null, storageOK = true;
  function load() {
    try { jobs = JSON.parse(localStorage.getItem(KEY) || "[]"); me = JSON.parse(localStorage.getItem(PROFILE_KEY) || "null"); }
    catch (e) { storageOK = false; jobs = []; me = null; }
    if (!Array.isArray(jobs)) jobs = [];
  }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(jobs)); storageOK = true; } catch (e) { storageOK = false; } }
  function saveMe() { try { if (me) localStorage.setItem(PROFILE_KEY, JSON.stringify(me)); else localStorage.removeItem(PROFILE_KEY); } catch (e) { storageOK = false; } }
  function blank() {
    return { id: uid(), company: "", title: "", link: "", location: "", arrangement: "", deadline: "", status: "saved", nextAction: "", nextDue: "",
      appliedDate: "", followUpDate: "", tailored: false, notes: "", description: "", updatedAt: today() };
  }
  function byId(id) { for (var i = 0; i < jobs.length; i++) if (jobs[i].id === id) return jobs[i]; return null; }
  function setStatus(o, s) { if (o.status === s) return; o.status = s; if (s === "applied" && !o.appliedDate) o.appliedDate = today(); o.updatedAt = today(); }

  // ---------- Resume: reading, skills, matching (keyword based, in the browser) ----------
  var SKILLS = ["SQL", "Python", "R", "Tableau", "Power BI", "Excel", "VBA", "SAS", "SPSS", "Stata", "Snowflake", "AWS", "Azure", "GCP", "BigQuery", "Spark",
    "Looker", "Alteryx", "dbt", "Git", "JavaScript", "Java", "machine learning", "deep learning", "NLP", "statistics", "regression", "forecasting", "A/B testing",
    "data visualization", "ETL", "data modeling", "dashboards", "pandas", "scikit-learn", "TensorFlow", "Salesforce", "Google Analytics", "SAP", "project management",
    "Agile", "financial modeling", "market research", "supply chain", "optimization", "Jira", "PowerPoint", "stakeholder management", "storytelling", "time series", "Databricks", "Qualtrics"];
  function findSkills(text) {
    if (!text) return [];
    var low = text.toLowerCase();
    return SKILLS.filter(function (s) {
      if (s === "R") return /(^|[\s,(/;])R(?=[\s,)/;.]|$)/.test(text);
      return new RegExp("(^|[^a-z0-9])" + s.toLowerCase().replace(/[.*+?^${}()|[\]\\\/]/g, "\\$&") + "(?=[^a-z0-9]|$)").test(low);
    });
  }
  function mySkills() { return me ? splitList(me.skills) : []; }
  // Match = share of the skills a job description asks for that are on your resume.
  function match(o) {
    var mine = mySkills().map(function (s) { return s.toLowerCase(); });
    if (!mine.length || !o.description) return null;
    var wanted = findSkills(o.description);
    if (!wanted.length) return null;
    var have = wanted.filter(function (s) { return mine.indexOf(s.toLowerCase()) >= 0; });
    var missing = wanted.filter(function (s) { return mine.indexOf(s.toLowerCase()) < 0; });
    return { pct: Math.round(100 * have.length / wanted.length), have: have, missing: missing, wanted: wanted };
  }
  function matchWord(p) { return p >= 75 ? "Great match" : p >= 50 ? "Good match" : "Stretch"; }
  function badge(o) {
    var m = match(o); if (!m) return "";
    return '<span class="badge ' + (m.pct >= 75 ? "" : m.pct >= 50 ? "mid" : "low") + '" title="' + esc(m.pct + "% of the skills in this posting are on your resume") + '">' + matchWord(m.pct) + " · " + m.pct + "%</span>";
  }
  function loadScript(src) {
    return new Promise(function (resolve, reject) {
      if (document.querySelector('script[src="' + src + '"]')) return resolve();
      var s = document.createElement("script"); s.src = src; s.onload = resolve;
      s.onerror = function () { reject(new Error("Couldn't load the file reader. Check your internet connection and try again.")); };
      document.head.appendChild(s);
    });
  }
  function readFile(file, asText) {
    return new Promise(function (res, rej) { var r = new FileReader(); r.onload = function () { res(r.result); }; r.onerror = rej; if (asText) r.readAsText(file); else r.readAsArrayBuffer(file); });
  }
  function readResume(file) {
    var name = file.name.toLowerCase();
    if (/\.pdf$/.test(name) || file.type === "application/pdf") {
      var base = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/";
      return loadScript(base + "pdf.worker.min.js").then(function () { return loadScript(base + "pdf.min.js"); }).then(function () { return readFile(file); }).then(function (buf) {
        var lib = window.pdfjsLib; lib.GlobalWorkerOptions.workerSrc = base + "pdf.worker.min.js";
        return lib.getDocument({ data: new Uint8Array(buf) }).promise.then(function (pdf) {
          var pages = []; for (var i = 1; i <= Math.min(pdf.numPages, 6); i++) pages.push(pdf.getPage(i).then(function (p) { return p.getTextContent(); }));
          return Promise.all(pages).then(function (cs) { return cs.map(function (c) { return c.items.map(function (it) { return it.str + (it.hasEOL ? "\n" : " "); }).join(""); }).join("\n"); });
        });
      });
    }
    if (/\.docx$/.test(name)) {
      return loadScript("https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js").then(function () { return readFile(file); })
        .then(function (buf) { return window.mammoth.extractRawText({ arrayBuffer: buf }).then(function (r) { return r.value; }); });
    }
    if (/\.(txt|md)$/.test(name) || /^text\//.test(file.type)) return readFile(file, true).then(String);
    return Promise.reject(new Error("Please choose a PDF, Word (.docx), or .txt file."));
  }
  function parseResume(text) {
    var lines = text.split(/\n/).map(function (l) { return l.replace(/\s+/g, " ").trim(); }).filter(Boolean);
    var out = { skills: findSkills(text), name: "", roles: "", location: "" };
    for (var i = 0; i < Math.min(4, lines.length); i++) {
      var w = lines[i].split(" ");
      if (w.length >= 2 && w.length <= 4 && /^[A-Za-z][A-Za-z.'\- ]+$/.test(lines[i])) { out.name = w[0].charAt(0).toUpperCase() + w[0].slice(1).toLowerCase(); break; }
    }
    var roles = {}, re = /\b(data|business|marketing|financial|finance|operations|product|risk|pricing|supply chain|analytics)\s+(analyst|scientist|intern|associate|consultant|manager|engineer)\b/gi, m;
    while ((m = re.exec(text))) roles[(m[1] + " " + m[2]).toLowerCase().replace(/ intern$/, " analyst")] = 1;
    out.roles = Object.keys(roles).slice(0, 3).join(", ");
    var loc = text.match(/\b([A-Z][a-zA-Z]+(?: [A-Z][a-zA-Z]+){0,2}, *(?:CA|NY|WA|TX|OR|IL|MA|CO|NC|GA|FL|AZ|NV|UT|VA|DC|NJ|PA))\b/);
    if (loc) out.location = loc[1];
    return out;
  }

  // ---------- Job description extraction (rule-based) ----------
  function parseLooseDate(s) {
    s = s.replace(/(\d)(st|nd|rd|th)\b/, "$1").replace(".", "").trim(); var m;
    if (/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
    if ((m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/))) { var y = +m[3]; if (y < 100) y += 2000; return y + "-" + pad(+m[1]) + "-" + pad(+m[2]); }
    if ((m = s.match(/^([A-Za-z]{3})[a-z]*\s+(\d{1,2}),?\s*(\d{4})?$/))) {
      var mi = MONTHS.map(function (x) { return x.toLowerCase(); }).indexOf(m[1].toLowerCase()); if (mi < 0) return "";
      var yy = m[3] ? +m[3] : new Date().getFullYear(), out = yy + "-" + pad(mi + 1) + "-" + pad(+m[2]);
      if (!m[3] && out < today()) out = (yy + 1) + out.slice(4);
      return out;
    }
    return "";
  }
  function extractJD(text) {
    var r = {}, m; if (!text || !text.trim()) return r;
    var lines = text.split(/\r?\n/).map(function (l) { return l.trim(); }).filter(Boolean);
    m = text.match(/https?:\/\/[^\s)>"']+/i); if (m) r.link = m[0];
    m = text.match(/(?:job\s*title|position|role)\s*[:\-–]\s*(.+)/i); if (m) r.title = m[1].trim();
    m = text.match(/(?:company(?:\s*name)?|employer|organization)\s*[:\-–]\s*(.+)/i); if (m) r.company = m[1].trim();
    if (!r.title || !r.company) for (var i = 0; i < Math.min(lines.length, 6); i++) {
      var at = lines[i].match(/^(.{3,80}?)\s+(?:at|@|\||-|–|—)\s+(.{2,60}?)\.?$/);
      if (at && !/https?:/.test(lines[i])) { r.title = r.title || at[1].trim(); r.company = r.company || at[2].trim(); break; }
    }
    if (!r.title) { var kw = /(analyst|scientist|intern|engineer|manager|associate|consultant|specialist|coordinator|developer|strategist)/i;
      for (var j = 0; j < Math.min(lines.length, 8); j++) if (kw.test(lines[j]) && lines[j].length < 90) { r.title = lines[j].split(/[.,(]/)[0].trim(); break; } }
    if (/\bhybrid\b/i.test(text)) r.arrangement = "Hybrid";
    else if (/\bremote\b/i.test(text)) r.arrangement = "Remote";
    else if (/\b(on-?site|in[-\s]office|in[-\s]person)\b/i.test(text)) r.arrangement = "On-site";
    m = text.match(/\b([A-Z][a-zA-Z.]+(?: [A-Z][a-zA-Z.]+){0,2}, *(?:A[KLRZ]|C[AOT]|D[CE]|FL|GA|HI|I[ADLN]|K[SY]|LA|M[ADEINOST]|N[CDEHJMVY]|O[HKR]|PA|RI|S[CD]|T[NX]|UT|V[AT]|W[AIVY]))\b/); if (m) r.location = m[1];
    var dl = text.match(/(?:deadline|apply by|applications? (?:close|due)|closing date|closes)[^\n\d]{0,20}?([A-Za-z]{3,9}\.?\s+\d{1,2}(?:st|nd|rd|th)?,?\s*\d{0,4}|\d{1,2}\/\d{1,2}\/\d{2,4}|\d{4}-\d{2}-\d{2})/i);
    if (dl) { var d = parseLooseDate(dl[1]); if (d) r.deadline = d; }
    return r;
  }

  // ---------- Next steps ----------
  function buildSteps() {
    var t = today(), out = [];
    jobs.forEach(function (o) {
      if (CLOSED[o.status]) return;
      if (o.nextAction) out.push({ act: "next", text: o.nextAction, due: o.nextDue, o: o });
      if (o.status === "saved") {
        var m = match(o);
        if (m && m.missing.length && !o.tailored)
          out.push({ act: "tailor", text: "Tailor your resume: this job asks for " + m.missing.slice(0, 3).join(", "), due: o.deadline ? addDays(o.deadline, -2) : "", o: o });
        if (o.deadline && diffDays(o.deadline, t) >= 0 && diffDays(o.deadline, t) <= 14)
          out.push({ act: "apply", text: "Apply before the posting closes on " + fmt(o.deadline), due: o.deadline, o: o });
      }
      if (o.status === "applied" && o.appliedDate) {
        var base = o.followUpDate && o.followUpDate > o.appliedDate ? o.followUpDate : o.appliedDate, due = addDays(base, FOLLOW_UP_DAYS);
        if (diffDays(due, t) <= 7) out.push({ act: "followup", text: "No reply yet. Send a short follow-up to the recruiter", due: due, o: o });
      }
    });
    out.sort(function (a, b) { if (!a.due !== !b.due) return a.due ? -1 : 1; return a.due < b.due ? -1 : a.due > b.due ? 1 : 0; });
    return out;
  }
  function completeStep(act, id) {
    var o = byId(id); if (!o) return;
    var before = JSON.stringify(o), undo = function () { var i = jobs.indexOf(o); if (i >= 0) jobs[i] = JSON.parse(before); save(); render(); };
    if (act === "next") { o.notes = (o.notes ? o.notes + "\n" : "") + "Done " + fmt(today()) + ": " + o.nextAction; o.nextAction = ""; o.nextDue = ""; save(); render();
      toast("Nice. What's next for " + esc(o.company) + "?", "Add next step", function () { openJob(o.id, "f-nextAction"); }); return; }
    if (act === "tailor") { o.tailored = true; save(); render(); toast("Resume tailored for " + esc(o.company) + ".", "Undo", undo); return; }
    if (act === "apply") { setStatus(o, "applied"); save(); render(); toast("Marked as applied. I'll remind you to follow up in 2 weeks.", "Undo", undo); return; }
    if (act === "followup") { o.followUpDate = today(); save(); render(); toast("Follow-up logged.", "Undo", undo); }
  }

  // Shared by the welcome screen and the "Me" panel.
  function wireUpload(root, isWelcome) {
    var input = $("#resumeFile", root), drop = $("#drop", root);

      var st = $("#upStatus", root); st.className = "status"; st.textContent = "Reading " + file.name + "…";
      readResume(file).then(function (text) {
        if (!text || text.trim().length < 40) throw new Error("I couldn't find any text in that file. If it's a scanned PDF, try the Word version or a .txt copy.");
        st.textContent = "";
        showConfirm(root, parseResume(text), file.name, isWelcome);
      }).catch(function (err) { st.className = "status err"; st.textContent = err.message || "I couldn't read that file."; });
    };
    input.addEventListener("change", function () { if (input.files[0]) handle(input.files[0]); });
    ["dragover", "dragenter"].forEach(function (ev) { drop.addEventListener(ev, function (e) { e.preventDefault(); drop.classList.add("over"); }); });
    ["dragleave", "drop"].forEach(function (ev) { drop.addEventListener(ev, function () { drop.classList.remove("over"); }); });
    drop.addEventListener("drop", function (e) { e.preventDefault(); var f = e.dataTransfer && e.dataTransfer.files[0]; if (f) handle(f); });

  function renderJobs() {

    }
  }

  // ---------- Toast ----------
  var toastTimer;
  function toast(html, label, act) {
    clearTimeout(toastTimer);
    var root = $("#toastRoot");
    root.innerHTML = '<div class="toast" role="status"><span>' + html + "</span>" + (label ? '<button type="button" id="toastAct">' + esc(label) + "</button>" : "") + "</div>";
    if (label) $("#toastAct").addEventListener("click", function () { root.innerHTML = ""; act(); });
    toastTimer = setTimeout(function () { root.innerHTML = ""; }, label ? 7000 : 2600);
  }

  // ---------- Events ----------
  function toggleSamples() {
    if (jobs.some(function (o) { return o.sample; })) {
      var removed = jobs.filter(function (o) { return o.sample; });
      jobs = jobs.filter(function (o) { return !o.sample; }); save(); render();
      toast("Sample jobs removed.", "Undo", function () { jobs = removed.concat(jobs); save(); render(); });
    } else { ui.skippedWelcome = true; jobs = samples().concat(jobs); save(); render(); toast("Added 6 sample jobs. Remove them any time at the bottom of the page."); }
  }
  document.addEventListener("click", function (e) {
    var t = e.target;
    if (t.closest("#btnAdd") || t.closest("[data-act='add']")) { openJob(null); return; }
    if (t.closest("#btnMe") || t.closest("[data-act='me']")) { openMe(); return; }
    if (t.closest("#btnSamples") || t.closest("[data-act='samples']")) { toggleSamples(); return; }
    if (t.closest("[data-act='skip']")) { ui.skippedWelcome = true; render(); return; }
    if (t.closest("[data-act='all-steps']")) { ui.showAll = !ui.showAll; render(); return; }
    var d = t.closest("[data-done]"); if (d) { completeStep(d.dataset.done, d.dataset.id); return; }
    if (t.closest("select") || t.closest("a") || t.closest(".modal")) return;
    var j = t.closest("[data-open]"); if (j) openJob(j.dataset.open);
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Enter" && e.target.classList && e.target.classList.contains("job")) openJob(e.target.dataset.open);
  });
  document.addEventListener("change", function (e) {
    var t = e.target;
    if (t.dataset.status) {
      var o = byId(t.dataset.status); if (!o) return;
      var prev = o.status; setStatus(o, t.value); save(); render();
      var msg = esc(o.company) + " is now " + statusLabel(o.status).toLowerCase() + ".";
      if (o.status === "applied") toast(msg + " I'll remind you to follow up in 2 weeks.", "Undo", function () { o.status = prev; save(); render(); });
      else if (o.status === "interviewing") toast(msg + " Good luck!", "Add a prep step", function () { openJob(o.id, "f-nextAction"); });
      else toast(msg, "Undo", function () { o.status = prev; save(); render(); });
      return;
    }
    if (t.id === "filter") { ui.filter = t.value; renderJobs(); }
    if (t.id === "sort") { ui.sort = t.value; renderJobs(); }
  });
  document.addEventListener("input", function (e) { if (e.target.id === "q") { ui.q = e.target.value; renderJobs(); } });

  load();
  render();
})();
</script>
</body>
</html>
