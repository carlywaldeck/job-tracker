<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Next Move Job Tracker</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: sticky header with view tabs; one working view at a time; modals for editing and data. */
:root {
  --bg: #eef2f5; --surface: #ffffff; --surface-2: #f6f8fa; --ink: #15202b; --muted: #586675; --line: #d6dee6;
  --accent: #2647c2; --accent-ink: #ffffff; --accent-soft: #e3e9fb;
  --good: #157f3b; --warn: #a75a00; --bad: #b42318;
  --s-saved: #5f6f80; --s-applied: #2647c2; --s-interviewing: #a75a00; --s-offer: #157f3b; --s-rejected: #b42318; --s-withdrawn: #7b7f86;
  --shadow: 0 1px 2px rgba(21,32,43,.06), 0 6px 20px rgba(21,32,43,.08);
  --f-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body: "IBM Plex Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0e1319; --surface: #161d25; --surface-2: #1b2430; --ink: #e5ebf1; --muted: #98a6b5; --line: #2a3542;
  --accent: #8aa2ff; --accent-ink: #0b1020; --accent-soft: #1e2a4d;
  --good: #52c784; --warn: #f0a640; --bad: #ff8070;
  --s-saved: #9aa8b7; --s-applied: #8aa2ff; --s-interviewing: #f0a640; --s-offer: #52c784; --s-rejected: #ff8070; --s-withdrawn: #8d939b;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
  color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #0e1319; --surface: #161d25; --surface-2: #1b2430; --ink: #e5ebf1; --muted: #98a6b5; --line: #2a3542;
  --accent: #8aa2ff; --accent-ink: #0b1020; --accent-soft: #1e2a4d;
  --good: #52c784; --warn: #f0a640; --bad: #ff8070;
  --s-saved: #9aa8b7; --s-applied: #8aa2ff; --s-interviewing: #f0a640; --s-offer: #52c784; --s-rejected: #ff8070; --s-withdrawn: #8d939b;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.5; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
.wrap { max-width: 1240px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; margin: 0; letter-spacing: -0.01em; }
h2 { font-size: 1.5rem; }
h3 { font-size: 1.05rem; }
.mono, .date { font-family: var(--f-mono); font-variant-numeric: tabular-nums; font-size: .85em; }
.muted { color: var(--muted); }
a { color: var(--accent); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 7px 12px; font-weight: 500; }
button:hover { border-color: var(--muted); }
button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
button.primary:hover { filter: brightness(1.08); }
button.ghost { background: transparent; border-color: transparent; color: var(--accent); padding: 4px 8px; }
button.ghost:hover { background: var(--accent-soft); }
button.danger { color: var(--bad); }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, .card:focus-visible, tr:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
input, select, textarea { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; width: 100%; min-width: 0; }
textarea { resize: vertical; }
label { display: grid; gap: 4px; font-size: .85rem; font-weight: 500; color: var(--muted); }
label.check { display: flex; align-items: center; gap: 8px; color: var(--ink); }
label.check input { width: auto; }

/* Header */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line); }
.top-in { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 20px; padding-block: 12px; }
.brand { display: flex; align-items: baseline; gap: 10px; margin-right: auto; }
.brand h1 { font-size: 1.35rem; }
.brand h1 span { color: var(--accent); }
.brand small { color: var(--muted); font-size: .8rem; }
.tabs { display: flex; gap: 2px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 3px; overflow-x: auto; max-width: 100%; }
.tabs button { border: 0; background: transparent; padding: 6px 12px; border-radius: 7px; white-space: nowrap; color: var(--muted); }
.tabs button[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
.tabs .count { font-family: var(--f-mono); font-size: .75rem; margin-left: 4px; background: var(--bad); color: var(--surface); border-radius: 99px; padding: 0 6px; }
.head-actions { display: flex; gap: 8px; }

main { padding-block: 22px 40px; display: grid; gap: 18px; }
main > * { min-width: 0; }
.view-head { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 12px; }
.view-head p { margin: 4px 0 0; color: var(--muted); max-width: 65ch; }

.banner { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; background: var(--accent-soft); border: 1px solid color-mix(in srgb, var(--accent) 30%, transparent); padding: 10px 14px; border-radius: 10px; }
.banner p { margin: 0; flex: 1 1 280px; }
.banner.warn { background: color-mix(in srgb, var(--warn) 12%, var(--surface)); border-color: color-mix(in srgb, var(--warn) 35%, transparent); }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; min-width: 0; }

/* Status pills */
.pill { --c: var(--s-saved); display: inline-flex; align-items: center; gap: 6px; font-size: .78rem; font-weight: 600; padding: 2px 9px; border-radius: 99px; color: var(--c); background: color-mix(in srgb, var(--c) 13%, transparent); white-space: nowrap; }
.pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--c); }
[data-s="saved"] { --c: var(--s-saved); } [data-s="applied"] { --c: var(--s-applied); } [data-s="interviewing"] { --c: var(--s-interviewing); }
[data-s="offer"] { --c: var(--s-offer); } [data-s="rejected"] { --c: var(--s-rejected); } [data-s="withdrawn"] { --c: var(--s-withdrawn); }
.due { font-family: var(--f-mono); font-size: .78rem; padding: 1px 7px; border-radius: 6px; background: var(--surface-2); color: var(--muted); white-space: nowrap; }
.due.over { background: color-mix(in srgb, var(--bad) 14%, transparent); color: var(--bad); font-weight: 500; }
.due.soon { background: color-mix(in srgb, var(--warn) 14%, transparent); color: var(--warn); }
.interest { font-family: var(--f-mono); font-size: .75rem; color: var(--muted); letter-spacing: .08em; white-space: nowrap; }
.interest b { color: var(--accent); font-weight: 500; }

/* Today */
.today-grid { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: 18px; align-items: start; }
.group { display: grid; gap: 8px; }
.group + .group { margin-top: 18px; }
.group-h { display: flex; align-items: baseline; gap: 10px; text-transform: uppercase; letter-spacing: .08em; font-size: .75rem; font-weight: 600; color: var(--muted); }
.group-h.over { color: var(--bad); }
.task { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
.task.over { border-left: 4px solid var(--bad); }
.task .t-main { min-width: 0; }
.task .t-what { font-weight: 600; }
.task .t-who { color: var(--muted); font-size: .88rem; overflow-wrap: anywhere; }
.task .t-kind { font-size: .7rem; text-transform: uppercase; letter-spacing: .07em; color: var(--accent); font-weight: 600; margin-right: 6px; }
.task .t-side { display: flex; flex-wrap: wrap; justify-content: end; align-items: center; gap: 6px; }
.donebox { width: 22px; height: 22px; border-radius: 6px; border: 2px solid var(--line); padding: 0; background: var(--surface); }
.donebox:hover { border-color: var(--good); background: color-mix(in srgb, var(--good) 15%, transparent); }
.empty { color: var(--muted); padding: 22px; text-align: center; border: 1px dashed var(--line); border-radius: 10px; }
.focus { display: grid; gap: 10px; }
.focus .big { font-family: var(--f-display); font-size: 2.2rem; line-height: 1; }
.mini-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.mini-list li { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
.mini-list li span:first-child { min-width: 0; overflow-wrap: anywhere; }
.linkish { background: none; border: 0; padding: 0; color: var(--ink); text-align: left; font-weight: 500; }
.linkish:hover { color: var(--accent); text-decoration: underline; }

/* Board */
.board-scroll { overflow-x: auto; padding-bottom: 8px; }
.board { display: grid; grid-template-columns: repeat(6, minmax(170px, 1fr)); gap: 10px; min-width: 1100px; }
.col { background: var(--surface-2); border: 1px solid var(--line); border-radius: 12px; padding: 10px; display: flex; flex-direction: column; gap: 8px; min-height: 240px; }
.col.over { outline: 2px dashed var(--accent); outline-offset: -4px; }
.col-h { display: flex; justify-content: space-between; align-items: center; padding: 2px 4px 6px; }
.col-h .n { font-family: var(--f-mono); color: var(--muted); font-size: .8rem; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px; display: grid; gap: 6px; cursor: grab; }
.card:hover { box-shadow: var(--shadow); }
.card.dragging { opacity: .45; }
.card .co { font-weight: 600; overflow-wrap: anywhere; }
.card .ti { color: var(--muted); font-size: .88rem; overflow-wrap: anywhere; }
.card .meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.card .nx { font-size: .82rem; border-top: 1px solid var(--line); padding-top: 6px; display: flex; justify-content: space-between; align-items: flex-start; gap: 6px; }
.card .nx span:first-child { min-width: 0; overflow-wrap: anywhere; }
.card select { font-size: .8rem; padding: 3px 6px; }
.col-hint { color: var(--muted); font-size: .8rem; text-align: center; padding: 14px 4px; border: 1px dashed var(--line); border-radius: 8px; }

/* List */
.filters { display: grid; grid-template-columns: minmax(0, 2fr) repeat(4, minmax(0, 1fr)); gap: 10px; }
.table-scroll { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
table { border-collapse: collapse; width: 100%; min-width: 860px; }
th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: .72rem; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); background: var(--surface-2); font-weight: 600; }
th button { border: 0; background: none; padding: 0; font: inherit; color: inherit; text-transform: inherit; letter-spacing: inherit; }
th button:hover { color: var(--accent); }
tbody tr { cursor: pointer; }
tbody tr:hover { background: var(--surface-2); }
tbody tr:last-child td { border-bottom: 0; }
td .sub { color: var(--muted); font-size: .85rem; }

/* Dashboard */
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.kpi { display: grid; gap: 2px; }
.kpi .v { font-family: var(--f-display); font-size: 2rem; line-height: 1.1; font-variant-numeric: tabular-nums; }
.kpi .l { font-size: .75rem; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 600; }
.kpi .s { font-size: .82rem; color: var(--muted); }
.dash-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; }
.bars { display: grid; gap: 8px; margin-top: 12px; }
.bar-row { display: grid; grid-template-columns: 110px minmax(0, 1fr) 32px; gap: 10px; align-items: center; font-size: .88rem; }
.bar-track { height: 14px; background: var(--surface-2); border-radius: 4px; overflow: hidden; }
.bar-fill { height: 100%; background: var(--c); border-radius: 4px; }
.bar-row .num { font-family: var(--f-mono); text-align: right; }
.chart svg { width: 100%; height: auto; display: block; margin-top: 8px; }
.chart text { fill: var(--muted); font-family: var(--f-mono); font-size: 11px; }

/* Modal */
.overlay { position: fixed; inset: 0; z-index: 50; background: color-mix(in srgb, var(--ink) 45%, transparent); display: flex; align-items: flex-start; justify-content: center; overflow-y: auto; padding: max(24px, env(safe-area-inset-top, 0px)) max(12px, env(safe-area-inset-right, 0px)) 24px max(12px, env(safe-area-inset-left, 0px)); }
.modal { background: var(--surface); border-radius: 14px; width: 100%; max-width: 760px; box-shadow: var(--shadow); border: 1px solid var(--line); }
.modal-h { display: flex; justify-content: space-between; align-items: center; padding: 16px 20px; border-bottom: 1px solid var(--line); gap: 12px; }
.modal-b { padding: 16px 20px; display: grid; gap: 18px; }
.modal-f { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; padding: 14px 20px; border-top: 1px solid var(--line); background: var(--surface-2); border-radius: 0 0 14px 14px; }
.modal-f .left { margin-right: auto; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
fieldset { border: 0; padding: 0; margin: 0; display: grid; gap: 10px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
fieldset .full { grid-column: 1 / -1; }
legend { font-family: var(--f-display); font-weight: 600; font-size: 1rem; padding: 0; margin-bottom: 10px; }
.jd { background: var(--accent-soft); border-radius: 10px; padding: 12px; display: grid; gap: 8px; }
.jd summary { cursor: pointer; font-weight: 600; }
.tag { display: inline-block; font-size: .68rem; text-transform: uppercase; letter-spacing: .07em; font-weight: 600; padding: 1px 6px; border-radius: 4px; background: var(--surface); color: var(--muted); border: 1px solid var(--line); margin-left: 6px; vertical-align: middle; }
.data-sec { display: grid; gap: 8px; }
.data-sec p { margin: 0; color: var(--muted); }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.err { color: var(--bad); font-size: .88rem; }

.toast { position: fixed; z-index: 60; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 10px 14px; border-radius: 10px; display: flex; gap: 12px; align-items: center; box-shadow: var(--shadow); max-width: calc(100% - 32px); }
.toast button { background: transparent; color: var(--bg); border-color: color-mix(in srgb, var(--bg) 40%, transparent); padding: 4px 10px; }

footer { padding-block: 0 32px; color: var(--muted); font-size: .85rem; }
footer p { margin: 0; max-width: 80ch; }

@media (max-width: 900px) {
  .today-grid, .dash-grid { grid-template-columns: minmax(0, 1fr); }
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .filters { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .filters .search { grid-column: 1 / -1; }
}
@media (max-width: 560px) {
  fieldset { grid-template-columns: minmax(0, 1fr); }
  .brand small { display: none; }
  .tabs { width: 100%; }
  .tabs button { flex: 1 0 auto; }
  .task { grid-template-columns: auto minmax(0, 1fr); }
  .task .t-side { grid-column: 2; justify-content: start; }
  .bar-row { grid-template-columns: 90px minmax(0, 1fr) 28px; }
}
@media (prefers-reduced-motion: no-preference) {
  .card, .task, button { transition: box-shadow .15s, border-color .15s, background-color .15s; }
}
</style>
</head>
<body>

<header class="top">
  <div class="wrap top-in">
    <div class="brand"><h1>Next<span>Move</span></h1><small>Job &amp; internship tracker</small></div>
    <nav class="tabs" role="tablist" aria-label="Views">
      <button role="tab" data-view="today" id="tab-today">Today</button>
      <button role="tab" data-view="board" id="tab-board">Board</button>
      <button role="tab" data-view="list" id="tab-list">All opportunities</button>
      <button role="tab" data-view="dash" id="tab-dash">Dashboard</button>
    </nav>
    <div class="head-actions">
      <button id="btnData" type="button">Import / Export</button>
      <button id="btnAdd" class="primary" type="button">+ Add opportunity</button>
    </div>
  </div>
</header>

<main class="wrap">
  <div id="banners" class="group"></div>
  <section id="view"></section>
</main>

<footer class="wrap">
  <p><strong>Where your data lives:</strong> everything is saved in this browser's local storage on this device. Nothing is sent to a server. Clearing your browser data or switching devices will lose it, so use <button class="ghost" id="btnFooterData" type="button">Import / Export</button> to back up or move your tracker.</p>
</footer>

<div id="modalRoot"></div>
<div id="toastRoot"></div>

<script>
(function () {
  "use strict";
  var KEY = "nextmove.tracker.v1";
  var VIEW_KEY = "nextmove.view";
  var STATUSES = [
    { id: "saved", label: "Saved" },
    { id: "applied", label: "Applied" },
    { id: "interviewing", label: "Interviewing" },
    { id: "offer", label: "Offer" },
    { id: "rejected", label: "Rejected" },
    { id: "withdrawn", label: "Withdrawn" }
  ];
  var CLOSED = { rejected: 1, withdrawn: 1 };
  var INTEREST = { high: 3, medium: 2, low: 1 };
  var FOLLOW_UP_DAYS = 14; // Career Services guide: reach out two weeks after applying / posting closes

  // ---------- Dates ----------
  function pad(n) { return (n < 10 ? "0" : "") + n; }
  function iso(d) { return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
  function today() { return iso(new Date()); }
  function parseISO(s) { var p = s.split("-"); return new Date(+p[0], +p[1] - 1, +p[2]); }
  function addDays(s, n) { var d = parseISO(s); d.setDate(d.getDate() + n); return iso(d); }
  function diffDays(a, b) { return Math.round((parseISO(a) - parseISO(b)) / 86400000); } // a - b
  var MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  function fmt(s) { if (!s) return ""; var d = parseISO(s); return MONTHS[d.getMonth()] + " " + d.getDate(); }
  function rel(s) {
    var n = diffDays(s, today());
    if (n === 0) return "today";
    if (n === 1) return "tomorrow";
    if (n === -1) return "yesterday";
    if (n < 0) return -n + "d overdue";
    if (n < 7) return "in " + n + "d";
    return fmt(s);
  }
  function dueChip(s, label) {
    if (!s) return "";
    var n = diffDays(s, today());
    var cls = n < 0 ? "due over" : n <= 3 ? "due soon" : "due";
    return '<span class="' + cls + '" title="' + esc(fmt(s)) + '">' + (label ? esc(label) + " " : "") + esc(rel(s)) + "</span>";
  }

  // ---------- Utils ----------
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
  function $(sel, root) { return (root || document).querySelector(sel); }
  function $all(sel, root) { return Array.prototype.slice.call((root || document).querySelectorAll(sel)); }
  function statusLabel(id) { for (var i = 0; i < STATUSES.length; i++) if (STATUSES[i].id === id) return STATUSES[i].label; return id; }
  function pill(s) { return '<span class="pill" data-s="' + esc(s) + '">' + esc(statusLabel(s)) + "</span>"; }
  function interestDots(v) { var n = INTEREST[v] || 0; return '<span class="interest" title="Interest: ' + esc(v || "not set") + '"><b>' + "●".repeat(n) + "</b>" + "○".repeat(3 - n) + "</span>"; }
  function safeUrl(u) { return /^https?:\/\//i.test(u || "") ? u : ""; }

  // ---------- Storage ----------
  var storageOK = true;
  var state = { opps: [], seeded: false };
  function load() {
    try {
      var raw = localStorage.getItem(KEY);
      if (raw) { var d = JSON.parse(raw); state.opps = Array.isArray(d.opps) ? d.opps : []; state.seeded = !!d.seeded; return; }
      state.opps = sampleData(); state.seeded = true; save();
    } catch (e) { storageOK = false; state.opps = sampleData(); state.seeded = true; }
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify({ version: 1, savedAt: new Date().toISOString(), seeded: state.seeded, opps: state.opps })); storageOK = true; }
    catch (e) { storageOK = false; }
  }
  function getPref(k, d) { try { return localStorage.getItem(k) || d; } catch (e) { return d; } }
  function setPref(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }

  function blank() {
    return { id: uid(), company: "", title: "", link: "", location: "", arrangement: "", deadline: "", status: "saved", interest: "medium",
      nextAction: "", nextDue: "", appliedDate: "", resume: "", contact: "", interviewDate: "", thankYouSent: false, followUpDate: "",

  // ---------- Tasks for "Today" ----------
  function buildTasks() {
    var t = today(), tasks = [];

      if (CLOSED[o.status]) return;
      if (o.nextAction && o.nextDue) tasks.push({ kind: "Next step", text: o.nextAction, due: o.nextDue, o: o, act: "next" });
      else if (o.nextAction) tasks.push({ kind: "Next step", text: o.nextAction, due: "", o: o, act: "next" });
      if (o.status === "saved" && o.deadline && diffDays(o.deadline, t) >= 0 && diffDays(o.deadline, t) <= 14)
        tasks.push({ kind: "Deadline", text: "Submit application (posting closes " + fmt(o.deadline) + ")", due: o.deadline, o: o, act: "apply" });
      if (o.status === "applied" && o.appliedDate) {
        var base = o.followUpDate && o.followUpDate > o.appliedDate ? o.followUpDate : o.appliedDate;
        var due = addDays(base, FOLLOW_UP_DAYS);
        if (diffDays(due, t) <= 7) tasks.push({ kind: "Follow up", text: "No reply yet. Send a polite check-in to the recruiter", due: due, o: o, act: "followup" });
      }
      if (o.interviewDate && !o.thankYouSent && diffDays(o.interviewDate, t) <= 0)
        tasks.push({ kind: "Thank-you", text: "Send a thank-you note for your " + fmt(o.interviewDate) + " interview", due: addDays(o.interviewDate, 1), o: o, act: "thanks" });
      if (o.interviewDate && diffDays(o.interviewDate, t) > 0 && diffDays(o.interviewDate, t) <= 7)
        tasks.push({ kind: "Interview", text: "Interview on " + fmt(o.interviewDate) + ". Review notes and prepare questions", due: o.interviewDate, o: o, act: "prep" });
    });
    tasks.sort(function (a, b) {
      if (!a.due !== !b.due) return a.due ? -1 : 1;
      if (a.due !== b.due) return a.due < b.due ? -1 : 1;
      return (INTEREST[b.o.interest] || 0) - (INTEREST[a.o.interest] || 0);
    });
    return tasks;
  }

          if (!Array.isArray(arr)) throw new Error("That JSON isn't a tracker backup.");
          list = arr.map(function (x) { var n = normalize(x); if (x.id) n.id = x.id; delete n.example; return n; });
        } else list = importCSV(text);
        if (!list.length) throw new Error("No rows with a company name were found.");
        if ($("#imReplace").checked) state.opps = list;
        else { var ids = {}; state.opps.forEach(function (o) { ids[o.id] = 1; }); list.forEach(function (o) { if (ids[o.id]) o.id = uid(); }); state.opps = list.concat(state.opps); }
        save(); render(); msg.className = ""; msg.textContent = "Imported " + list.length + " opportunit" + (list.length === 1 ? "y" : "ies") + ".";
      } catch (e) { msg.className = "err"; msg.textContent = "Import failed: " + e.message; }
    };
    $("#imFile").addEventListener("change", function (e) { var file = e.target.files[0]; if (!file) return; var r = new FileReader(); r.onload = function () { doImport(String(r.result), file.name); }; r.readAsText(file); });
    $("#imPaste").addEventListener("click", function () { doImport($("#imText").value, ""); });
    $("#loadSample").addEventListener("click", function () { state.opps = sampleData().concat(state.opps.filter(function (o) { return !o.example; })); save(); render(); $("#imMsg").textContent = "Example data loaded."; });
    $("#clearAll").addEventListener("click", function () {
      $("#clearConfirm").innerHTML = '<span class="err">This removes all ' + state.opps.length + ' entries.</span> <button type="button" class="danger" id="clearYes">Yes, delete all</button>';
      $("#clearYes").addEventListener("click", function () { state.opps = []; save(); render(); $("#clearConfirm").textContent = "All opportunities deleted."; });
    });
  }

  // ---------- Toast ----------
  var toastTimer;
  function toast(html, actLabel, act) {
    clearTimeout(toastTimer);
    var root = $("#toastRoot");
    root.innerHTML = '<div class="toast" role="status"><span>' + html + "</span>" + (actLabel ? '<button type="button" id="toastAct">' + esc(actLabel) + "</button>" : "") + "</div>";
    if (actLabel) $("#toastAct").addEventListener("click", function () { root.innerHTML = ""; act(); });
    toastTimer = setTimeout(function () { root.innerHTML = ""; }, actLabel ? 7000 : 2600);
  }

  // ---------- Events ----------
  function completeTask(act, id) {
    var o = byId(id); if (!o) return;
    var snapshot = JSON.parse(JSON.stringify(o));
    var undo = function () { var i = state.opps.indexOf(o); if (i >= 0) state.opps[i] = snapshot; save(); render(); };
    if (act === "next") {
      var done = o.nextAction; o.nextAction = ""; o.nextDue = "";
      o.notes = (o.notes ? o.notes + "\n" : "") + "✓ " + fmt(today()) + ": " + done;
      o.updatedAt = today(); save(); render();
      toast("Done! What's the next step for " + esc(o.company) + "?", "Set next step", function () { openEditor(o.id, "f-nextAction"); });
      return;
    }
    if (act === "apply") { setStatus(o, "applied"); save(); render(); toast("Marked " + esc(o.company) + " as applied. Follow-up reminder set for 2 weeks.", "Undo", undo); return; }
    if (act === "followup") { o.followUpDate = today(); o.notes = (o.notes ? o.notes + "\n" : "") + "✓ " + fmt(today()) + ": Followed up"; o.updatedAt = today(); save(); render(); toast("Follow-up logged. Next reminder in 2 weeks.", "Undo", undo); return; }
    if (act === "thanks") { o.thankYouSent = true; o.updatedAt = today(); save(); render(); toast("Thank-you note marked as sent.", "Undo", undo); }
  }

  document.addEventListener("click", function (e) {
    var t = e.target;
    var tab = t.closest(".tabs button"); if (tab) { view = tab.dataset.view; setPref(VIEW_KEY, view); render(); return; }
    if (t.closest("#btnAdd")) { openEditor(null); return; }
    if (t.closest("#btnData") || t.closest("#btnFooterData")) { openData(); return; }
    var ce = t.closest("[data-act='clear-examples']");
    if (ce) { var removed = state.opps.filter(function (o) { return o.example; }); state.opps = state.opps.filter(function (o) { return !o.example; }); save(); render(); toast("Examples cleared. Click “+ Add opportunity” to add your first one.", "Undo", function () { state.opps = removed.concat(state.opps); save(); render(); }); return; }
    var dn = t.closest("[data-done]"); if (dn) { completeTask(dn.dataset.done, dn.dataset.id); return; }
    var op = t.closest("[data-open]"); if (op) { openEditor(op.dataset.open); return; }
    if (t.closest("[data-stop]")) return;
    if (t.closest("select")) return;
    var card = t.closest("[data-card]"); if (card) { openEditor(card.dataset.card); return; }
    var row = t.closest("[data-row]"); if (row) { openEditor(row.dataset.row); return; }
    var sb = t.closest("[data-sort]"); if (sb) { var k = sb.dataset.sort; if (listState.sort === k) listState.dir *= -1; else { listState.sort = k; listState.dir = 1; } $("#f-sort").value = k; renderListBody(); }
  });
  document.addEventListener("keydown", function (e) {
    if (e.key !== "Enter") return;
    var c = e.target.closest && (e.target.closest("[data-card]") || e.target.closest("[data-row]"));
    if (c && (e.target === c)) openEditor(c.dataset.card || c.dataset.row);
  });
  document.addEventListener("change", function (e) {
    var t = e.target;
    if (t.dataset.move) { moveTo(t.dataset.move, t.value); return; }
    if (t.id === "f-status") { listState.status = t.value; renderListBody(); }
    if (t.id === "f-arr") { listState.arrangement = t.value; renderListBody(); }
    if (t.id === "f-int") { listState.interest = t.value; renderListBody(); }
    if (t.id === "f-sort") { listState.sort = t.value; listState.dir = 1; renderListBody(); }
  });
  document.addEventListener("input", function (e) { if (e.target.id === "f-q") { listState.q = e.target.value; renderListBody(); } });

  load();
  if (["today", "board", "list", "dash"].indexOf(view) < 0) view = "today";
  render();
})();
</script>
</body>
</html>
